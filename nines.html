<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nines trick</title>
<link rel="stylesheet" href="common.css">
<style>
  :root {
    --x: var(--purple);   /* how many nines */
    --n: var(--slate);    /* a nine, before regrouping */
    --t: var(--blue);     /* the tens digit */
    --o: var(--teal);     /* the ones digit */
    --gap: var(--red);    /* the missing cells */
  }

  /* portrait order: header, picture, result, picker */
  .top    { order: 0; }
  .stage  { order: 1; }
  .res    { order: 2; }
  .picker { order: 3; flex: none; }
  .picker.x { --hue: var(--x); }

  /* ---- the picture ---- */
  #pic { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #pic text { font: 700 13px ui-sans-serif, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .cell { transition: fill .45s, fill-opacity .45s, stroke .45s, stroke-opacity .45s; stroke-width: 1.5; }
  .cell.n   { fill: var(--n); fill-opacity: .55; stroke: var(--n); stroke-opacity: 0; }
  .cell.t   { fill: var(--t); fill-opacity: .75; stroke: var(--t); stroke-opacity: 0; }
  .cell.o   { fill: var(--o); fill-opacity: .75; stroke: var(--o); stroke-opacity: 0; }
  .cell.gap { fill: var(--gap); fill-opacity: .08; stroke: var(--gap); stroke-opacity: .8; stroke-dasharray: 4 3; }
  .lbl { transition: opacity .45s; }

  #rbtn[aria-pressed=true] { border-color: var(--t); box-shadow: 0 0 0 1.5px var(--t), var(--shadow); font-weight: 650; }

  /* ---- the answer ---- */
  .res { display: flex; flex-direction: column; gap: 4px; }
  .eq { font-size: 34px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .eq .x { color: var(--x); } .eq .t { color: var(--t); } .eq .o { color: var(--o); }
  .why { margin: 0; color: var(--ink-dim); font-size: 13.5px; }
  .why b.x { color: var(--x); } .why b.t { color: var(--t); } .why b.o { color: var(--o); } .why b.gap { color: var(--gap); }

  /* the dots in the Options panel */
  .colors .swatch.x { --hue: var(--x); } .colors .swatch.n { --hue: var(--n); }
  .colors .swatch.t { --hue: var(--t); } .colors .swatch.o { --hue: var(--o); } .colors .swatch.gap { --hue: var(--gap); }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <svg id="pic" role="img" aria-label="bars of ten, each missing one cell"></svg>
    <button class="float-btn" id="rbtn" aria-pressed="false">regroup the gaps</button>
  </div>

  <div class="side">
    <div class="top">
      <a class="back" href="./" aria-label="home">←</a>
      <h1>Nines trick <span>· 9 × x is 10 × x, minus x</span></h1>
      <button class="gear" id="gear" aria-expanded="false" aria-controls="opts">⚙ Options</button>
    </div>

    <div class="panel opts pop" id="opts" hidden>
      <div class="opt">
        <span class="k">colors</span>
        <div class="colors">
          <span class="swatch x"><span class="dot"><input type="color" data-k="x" aria-label="color for x"></span>x</span>
          <span class="swatch n"><span class="dot"><input type="color" data-k="n" aria-label="color for a nine"></span>nine</span>
          <span class="swatch t"><span class="dot"><input type="color" data-k="t" aria-label="color for the tens"></span>tens</span>
          <span class="swatch o"><span class="dot"><input type="color" data-k="o" aria-label="color for the ones"></span>ones</span>
          <span class="swatch gap"><span class="dot"><input type="color" data-k="gap" aria-label="color for the gaps"></span>gaps</span>
          <button class="mini" id="creset">reset</button>
        </div>
      </div>
    </div>

    <div class="panel res" aria-live="polite">
      <div class="eq">9 × <span class="x" id="ex">7</span> = <span class="t" id="et">6</span><span class="o" id="eo">3</span></div>
      <p class="why" id="why"></p>
    </div>

    <div class="picker x" id="px">
      <span class="tag"><b>x</b> · how many nines</span>
      <span class="dot" title="pick a color"><input type="color" data-k="x" aria-label="color for x"></span>
      <button class="pm" data-d="-1" aria-label="decrease x"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <input type="number" min="1" max="10" value="7" inputmode="numeric" aria-label="x, how many nines">
      <button class="pm" data-d="1" aria-label="increase x"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
(() => {
  'use strict';

  const { $, numberPicker, colorPicker, popovers } = doodle;
  const NS = 'http://www.w3.org/2000/svg';
  const MAX = 10;

  const st = { x: 7, regroup: false };
  const pic = $('pic');
  let cells = [], lbls = [];   // cells[i][j]: bar i, j-th cell from the bottom

  function el(tag, attrs, parent = pic) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }

  // ---- drawing ------------------------------------------------------------------
  // x bars, each a column of 10 cells. A nine is a bar with its top cell missing.
  // Regrouping moves all x gaps into the last bar: the first x − 1 bars are whole
  // tens, and the last bar keeps 10 − x ones.
  function draw() {
    const { x } = st;
    const W = pic.clientWidth, H = pic.clientHeight;
    if (!W || !H) return;
    pic.setAttribute('viewBox', `0 0 ${W} ${H}`);
    pic.replaceChildren();

    // the scale fits 10 bars, so changing x never resizes the cells
    const T = 16, Bm = 40, side = 16, gapX = .6;
    const s = Math.min((W - 2 * side) / (MAX + (MAX - 1) * gapX), (H - T - Bm) / 10, 46);
    const bw = s * (1 + gapX), total = x * s + (x - 1) * gapX * s;
    const ox = (W - total) / 2, oy = T + (H - T - Bm - 10 * s) / 2;   // top-left of bar 0

    cells = []; lbls = [];
    for (let i = 0; i < x; i++) {
      const col = [];
      for (let j = 0; j < 10; j++)
        col.push(el('rect', { class: 'cell', x: ox + i * bw + 1.5, y: oy + (9 - j) * s + 1.5,
                              width: s - 3, height: s - 3, rx: Math.min(5, s / 6) }));
      cells.push(col);
      const t = el('text', { class: 'lbl', x: ox + i * bw + s / 2, y: oy + 10 * s + 22, 'text-anchor': 'middle' });
      lbls.push(t);
    }
    paint();
  }

  // color the cells and labels for the current view (no rebuild, so the change fades)
  function paint() {
    const { x, regroup } = st;
    cells.forEach((col, i) => col.forEach((c, j) => {
      let k;
      if (!regroup) k = j === 9 ? 'gap' : 'n';
      else if (i < x - 1) k = 't';
      else k = j < 10 - x ? 'o' : 'gap';
      c.setAttribute('class', 'cell ' + k);
    }));
    lbls.forEach((t, i) => {
      const last = i === x - 1;
      t.textContent = !regroup ? '9' : last ? String(10 - x) : '10';
      t.setAttribute('fill', !regroup ? 'var(--n)' : last ? 'var(--o)' : 'var(--t)');
    });

    const tens = x - 1, ones = 10 - x;
    $('ex').textContent = x; $('et').textContent = tens; $('eo').textContent = ones;
    $('why').innerHTML = !regroup
      ? `<b class="x">${x}</b> bars of ten, each with <b class="gap">one gap</b>: that's 10 × ${x} − ${x}.`
      : `Slide all <b class="gap">${x} gaps</b> into the last bar. <b class="t">${tens}</b> whole tens are left, `
        + `and the last bar keeps <b class="o">${ones}</b>. The digits: ${x} − 1 and 10 − ${x}, `
        + `which add to <b class="t">${tens}</b> + <b class="o">${ones}</b> = 9.`;
    $('rbtn').textContent = regroup ? 'back to nines' : 'regroup the gaps';
  }

  // ---- controls -----------------------------------------------------------------
  numberPicker($('px'), { get: () => st.x, max: MAX, onChange: v => { st.x = v; draw(); } });

  const rbtn = $('rbtn');
  rbtn.addEventListener('click', () => {
    st.regroup = !st.regroup; rbtn.setAttribute('aria-pressed', st.regroup); paint();
  });

  popovers([[$('gear'), $('opts')]]);
  $('creset').addEventListener('click', colorPicker('nines.colors', ['x', 'n', 't', 'o', 'gap']).reset);

  new ResizeObserver(draw).observe($('stage'));
})();
</script>
</body>
</html>
