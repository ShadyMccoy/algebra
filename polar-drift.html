<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polar Drift</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: full-bleed canvas, mode tabs top-left, one control panel bottom-left. Single dark look by design. */
:root {
  --bg: #000000;
  --fg: #c4cadb;
  --muted: #7a829c;
  --accent: #7fd4ff;
  --panel: rgba(8, 10, 18, 0.82);
  --edge: rgba(196, 202, 219, 0.18);
  --font-ui: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
  font: 400 12px/1.5 var(--font-ui);
}
canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
}
button { font: inherit; }
.tabs, .panel { transition: opacity 0.6s; }
body.idle .tabs, body.idle .panel { opacity: 0; pointer-events: none; }
body.idle canvas { cursor: none; }
.tabs {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tabs button, .seg button {
  color: var(--muted);
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 4px;
  padding: 6px 12px;
  cursor: pointer;
  letter-spacing: 0.02em;
}
.tabs button:hover, .seg button:hover { color: var(--fg); }
.tabs button[aria-pressed="true"], .seg button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.tabs button:focus-visible, .seg button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs kbd { font: inherit; color: var(--muted); margin-right: 6px; }
.panel {
  position: fixed;
  left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(460px, calc(100% - 32px));
  box-sizing: border-box;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 4px;
}
.panel .dim { color: var(--muted); }
.panel .row { display: block; }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 4px 10px; }
.meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.m span { display: block; color: var(--muted); font-size: 11px; }
.m i { display: block; height: 4px; background: var(--edge); border-radius: 2px; overflow: hidden; }
.m b { display: block; height: 100%; width: 0; background: var(--accent); }
label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
input[type="range"] { width: 110px; accent-color: var(--accent); }
output { font-variant-numeric: tabular-nums; min-width: 2ch; }
.tabs a { color: var(--muted); text-decoration: none; padding: 6px 4px; }
.tabs a:hover { color: var(--fg); }
</style>
</head>
<body>

<canvas id="c" aria-label="Animated pattern of colored circles and lines, steered by the pointer or by sound"></canvas>
<nav class="tabs" id="tabs" aria-label="Variation"><a href="index.html">← Doodles</a></nav>

<div class="panel">
  <span class="row" id="blurb"></span>
  <span class="row dim" id="read"></span>
  <div class="ctl">
    <span class="dim">Input</span>
    <div class="seg" id="srcSeg">
      <button type="button" id="src-mouse" aria-pressed="true">Mouse</button>
      <button type="button" id="src-demo" aria-pressed="false">Demo beat</button>
      <button type="button" id="src-file" aria-pressed="false">Audio file</button>
      <button type="button" id="src-sys" aria-pressed="false">System sound</button>
    </div>
    <input type="file" id="file" accept="audio/*" hidden>
  </div>
  <div class="meters" aria-label="Input levels">
    <div class="m"><span>bass</span><i><b id="mb"></b></i></div>
    <div class="m"><span>steer</span><i><b id="ms"></b></i></div>
    <div class="m"><span>treble</span><i><b id="mt"></b></i></div>
    <div class="m"><span>loud</span><i><b id="ml"></b></i></div>
  </div>
  <div class="ctl">
    <label for="smooth"><input type="checkbox" id="smooth" checked> Smooth between steps</label>
    <label for="rate">Steps/sec <input type="range" id="rate" min="4" max="40" value="24"> <output id="rateOut" for="rate">24</output></label>
    <label for="gain">Line glow <input type="range" id="gain" min="20" max="150" value="140"> <output id="gainOut" for="gain">1.4</output></label>
    <label for="steerSens">Steer speed <input type="range" id="steerSens" min="10" max="300" value="100"> <output id="steerOut" for="steerSens">1.0</output></label>
    <label for="fill">Fill <input type="range" id="fill" min="0" max="100" value="75"> <output id="fillOut" for="fill">75</output></label>
  </div>
  <span class="row dim" id="srcInfo">Pointer left and right steers. Demo beat and audio files play sound.</span>
  <span class="row dim">Click the picture or press space to pause. Keys 1 to 4 switch variation, F for fullscreen. Controls hide after a few seconds.</span>
</div>

<script>
(function () {
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var $ = function (id) { return document.getElementById(id); };
  var TAU = Math.PI * 2;

  var W = 0, H = 0, mouse = 0.3, mode = 3;
  var paused = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var simHz = 24, smooth = true, gain = 1.4, steerSens = 1.0, fill = 0.75;
  var acc = 0, since = 0, lastNow = 0, simTime = 0, CT = 0, AL = 1, PX = 0, PY = 0;
  var inp = { steer: 0.3, kick: 0, shimmer: 0, level: 0.667 };
  var source = 'mouse';

  // ---- point buffers: the simulation writes positions, the renderer blends two of them ----
  var NMAX = 1100;
  function mk() { return { n: 0, x: new Float32Array(NMAX), y: new Float32Array(NMAX) }; }
  var prev = mk(), curr = mk();
  function copyCurrToPrev() { prev.n = curr.n; prev.x.set(curr.x); prev.y.set(curr.y); }
  function pos(i) {
    PX = prev.x[i] + (curr.x[i] - prev.x[i]) * AL;
    PY = prev.y[i] + (curr.y[i] - prev.y[i]) * AL;
  }
  function fade(a40, fd) {
    ctx.globalCompositeOperation = 'source-over';
    var a = 1 - Math.pow(1 - a40, fd * 40);   // same trail length at any frame rate
    ctx.fillStyle = 'rgba(0,0,0,' + a + ')';
    ctx.fillRect(0, 0, W, H);
  }
  // Your convertToPolar(), writing into PX/PY so no arrays are allocated per point.
  function polar(a, rr) {
    var ang = TAU * a / W;
    var y = rr * Math.pow(rr / H - 3, 2) / 4;
    PX = W / 2 + 2 * rr * Math.cos(ang) / 3;
    PY = H / 2 + 2 * y * Math.sin(ang) / 3;
  }

  // ---- variations ----
  var modes = [
    {
      name: 'Original',
      blurb: 'Your sketch. Circle n sits at an angle proportional to n times factor. Bass makes the circles swell.',
      f: 12055, read: '',
      init: function () { this.f = 12055; },
      compute: function (P, dt) {
        this.f += (-2 + 4 * inp.steer) * dt * 40;
        var k = 0;
        for (var l = 10; l < 500; l++) {
          polar(this.f * l / 5, Math.pow(l - 10, 1.2));
          P.x[k] = PX; P.y[k] = PY; k++;
        }
        P.n = k;
        this.read = 'factor ' + Math.round(this.f);
      },
      render: function (fd) {
        fade(10 / 255, fd);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        var rad = 10 * (1 + 0.5 * inp.kick), base = Math.floor(CT);
        for (var i = 0; i < curr.n; i++) {
          var s = base + i + 10;
          ctx.fillStyle = 'rgb(' + Math.min(255, Math.abs(s % 512 - 256)) + ',' +
                          Math.min(255, Math.abs((3 * s) % 512 - 256)) + ',255)';
          pos(i);
          ctx.beginPath();
          ctx.arc(PX, PY, rad, 0, TAU);
          ctx.fill();
          ctx.stroke();
        }
      }
    },
    {
      name: 'Sunflower',
      blurb: 'Radius grows like the square root of n and each step turns by the golden angle. Center is exactly the golden angle. Treble spins it.',
      rot: 0, c: 10, read: '',
      init: function () { this.rot = 0; },
      compute: function (P, dt) {
        var N = 900, R = Math.min(W, H) * 0.46, c = R / Math.sqrt(N);
        this.c = c;
        var d = (inp.steer - 0.5) * 0.06;
        var ang = 2.399963229728653 + d;
        this.rot += (0.003 + inp.shimmer * 0.012) * dt * 40;
        for (var n = 1; n <= N; n++) {
          var r = c * Math.sqrt(n), a = n * ang + this.rot;
          P.x[n - 1] = W / 2 + r * Math.cos(a);
          P.y[n - 1] = H / 2 + r * Math.sin(a);
        }
        P.n = N;
        this.read = 'offset from golden angle ' + (d * 180 / Math.PI).toFixed(2) + '°';
      },
      render: function (fd) {
        fade(0.28, fd);
        var rad = this.c * 0.85 * (1 + 0.45 * inp.kick);
        var lt = Math.min(75, 60 * (0.7 + 0.5 * inp.level));
        for (var i = 0; i < curr.n; i++) {
          ctx.fillStyle = 'hsl(' + (((i + 1) * 0.4 + CT * 0.8) % 360) + ',80%,' + lt + '%)';
          pos(i);
          ctx.beginPath();
          ctx.arc(PX, PY, rad, 0, TAU);
          ctx.fill();
        }
      }
    },
    {
      name: 'Moiré',
      blurb: 'Two spirals wound in opposite directions at nearly the same speed. Where they cross, light adds up. Bass swells the dots.',
      f: 12055, read: '',
      init: function () { this.f = 12055; },
      compute: function (P, dt) {
        this.f += (-2 + 4 * inp.steer) * 0.5 * dt * 40;
        var k = 0;
        for (var s = 0; s < 2; s++) {
          var sign = s === 0 ? 1 : -1, f = s === 0 ? this.f : this.f * 1.003;
          for (var n = 10; n < 500; n++) {
            polar(sign * f * n / 5, Math.pow(n - 10, 1.2));
            P.x[k] = PX; P.y[k] = PY; k++;
          }
        }
        P.n = k;
        this.read = 'factor ' + Math.round(this.f);
      },
      render: function (fd) {
        fade(0.1, fd);
        ctx.globalCompositeOperation = 'lighter';
        var rad = 7 * (1 + 0.8 * inp.kick), half = 490;
        var ma = Math.min(0.9, 0.5 * (0.7 + 0.5 * inp.level));
        for (var i = 0; i < curr.n; i++) {
          var n = (i % half) + 10;
          ctx.fillStyle = i < half
            ? 'hsla(' + (185 + (n % 60)) + ',90%,55%,' + ma + ')'
            : 'hsla(' + (15 + (n % 40)) + ',95%,55%,' + ma + ')';
          pos(i);
          ctx.beginPath();
          ctx.arc(PX, PY, rad, 0, TAU);
          ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
      }
    },
    {
      name: 'String',
      blurb: 'The 500 points joined by one thin line. A step near half a turn makes chords through the center. Bass brightens, treble shifts color.',
      phi: 2.9, read: '',
      init: function () { this.phi = 2.9; },
      compute: function (P, dt) {
        this.phi += (inp.steer - 0.5) * 0.0012 * dt * 40;
        // Fill 0: the pattern's radius is half the short side. Fill 100: it reaches the corners,
        // so the calculation runs past the canvas edge and the screen shows only part of it.
        var N = 500, S = Math.min(W, H), D = Math.hypot(W, H);
        var R = 0.5 * (S + fill * (D - S));
        for (var n = 0; n <= N; n++) {
          var u = Math.pow(n / N, 0.8), a = n * this.phi;
          P.x[n] = W / 2 + R * u * Math.cos(a);
          P.y[n] = H / 2 + R * u * Math.sin(a) * 0.92;
        }
        P.n = N + 1;
        this.read = 'angle step ' + this.phi.toFixed(3) + ' rad (' + (this.phi * 180 / Math.PI).toFixed(1) + '°)';
      },
      render: function (fd) {
        fade(0.3, fd);
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineWidth = 1 + inp.kick * 0.3;
        var bright = 0.7 + 0.5 * inp.level;
        var al = (0.3 + 0.1 * inp.kick) * gain * bright, shift = inp.shimmer * 60;
        // Lines that pass close to the center overlap the most, so they get dimmer.
        var cx = W / 2, cy = H / 2, p0 = Math.min(W, H) * 0.5 * 0.35;
        pos(0);
        var qx = PX, qy = PY;
        for (var i = 1; i < curr.n; i++) {
          pos(i);
          var dx = PX - qx, dy = PY - qy, d2 = dx * dx + dy * dy || 1;
          var t = -((qx - cx) * dx + (qy - cy) * dy) / d2;
          t = t < 0 ? 0 : t > 1 ? 1 : t;
          var ex = qx + t * dx - cx, ey = qy + t * dy - cy;
          var f = 0.1 + 0.9 * Math.min(1, Math.sqrt(ex * ex + ey * ey) / p0);
          ctx.strokeStyle = 'hsla(' + ((i * 0.7 + CT + shift) % 360) + ',85%,60%,' + (al * f) + ')';
          ctx.beginPath();
          ctx.moveTo(qx, qy);
          ctx.lineTo(PX, PY);
          ctx.stroke();
          qx = PX; qy = PY;
        }
        ctx.globalCompositeOperation = 'source-over';
      }
    }
  ];

  // ---- audio ----
  var ac = null, an = null, bus = null, fdata = null, noiseBuf = null, outG = null, sysTracks = null;
  var srcNode = null, demoTimer = null, nextTime = 0, stepIx = 0;
  var silentT = 0, silentShown = false;
  var cenAvg = null, cenDev = 0.3, bassAvg = 0, trebAvg = 0, kickEnv = 0, trebEnv = 0, steerS = 0.5, walk = 0, oscS = 0, Lpeak = 0.05, Ls = 0.667;

  function ensureAc() {
    if (!ac) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ac = new AC();
      an = ac.createAnalyser();
      an.fftSize = 1024;
      an.smoothingTimeConstant = 0.55;
      fdata = new Uint8Array(an.frequencyBinCount);
      bus = ac.createGain();
      bus.gain.value = 0.8;
      bus.connect(an);
      outG = ac.createGain();
      an.connect(outG);
      outG.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.2), ac.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended' && !paused) ac.resume();
    return true;
  }

  function stopSource() {
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
    if (srcNode) { try { srcNode.stop(); } catch (e) {} try { srcNode.disconnect(); } catch (e) {} srcNode = null; }
    if (sysTracks) { sysTracks.forEach(function (t) { t.stop(); }); sysTracks = null; }
    cenAvg = null; bassAvg = 0; trebAvg = 0; kickEnv = 0; trebEnv = 0; steerS = 0.5; walk = 0; oscS = 0; Lpeak = 0.05; Ls = 0.667;
  }

  function setSource(name, info) {
    source = name;
    if (outG) outG.gain.value = name === 'sys' ? 0 : 1;
    ['mouse', 'demo', 'file', 'sys'].forEach(function (k) {
      $('src-' + k).setAttribute('aria-pressed', k === name ? 'true' : 'false');
    });
    $('srcInfo').textContent = info;
    if (name === 'mouse') { inp.kick = 0; inp.shimmer = 0; }
  }

  // Small built-in beat: kick on the quarter, hats on the off-beats, a pentatonic arpeggio that climbs.
  function kick(t) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    o.connect(g); g.connect(bus);
    o.start(t); o.stop(t + 0.4);
  }
  function hat(t, v) {
    var s = ac.createBufferSource(), h = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf;
    h.type = 'highpass'; h.frequency.value = 7000;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    s.connect(h); h.connect(g); g.connect(bus);
    s.start(t); s.stop(t + 0.06);
  }
  function blip(t, f) {
    var o = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(3000, t);
    lp.frequency.exponentialRampToValueAtTime(400, t + 0.2);
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(lp); lp.connect(g); g.connect(bus);
    o.start(t); o.stop(t + 0.25);
  }
  var scale = [0, 3, 5, 7, 10];
  function playStep(i, t) {
    if (i % 4 === 0) kick(t);
    if (i % 2 === 1) hat(t, i % 4 === 3 ? 0.25 : 0.12);
    if (i % 2 === 0 || i % 8 === 7) {
      var oct = 1 + ((i >> 4) % 3);
      blip(t, 110 * Math.pow(2, (scale[(i * 3) % 5] + 12 * oct) / 12));
    }
  }
  function schedule() {
    while (nextTime < ac.currentTime + 0.12) {
      playStep(stepIx, nextTime);
      nextTime += 0.125;
      stepIx++;
    }
  }
  function startDemo() {
    if (!ensureAc()) { $('srcInfo').textContent = 'This browser has no Web Audio.'; return; }
    stopSource();
    stepIx = 0;
    nextTime = ac.currentTime + 0.08;
    demoTimer = setInterval(schedule, 25);
    setSource('demo', 'Playing the built-in beat.');
  }
  // Listens to whatever the computer is playing. The captured sound is analysed but not played again.
  function startSystem() {
    if (!ensureAc()) { $('srcInfo').textContent = 'This browser has no Web Audio.'; return; }
    $('srcInfo').textContent = 'Asking the browser to share sound...';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      $('srcInfo').textContent = 'This browser cannot capture system sound. Try Chrome or Edge.';
      return;
    }
    Promise.resolve().then(function () { return navigator.mediaDevices.getDisplayMedia({ video: true, audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }); }).then(function (stream) {
      var at = stream.getAudioTracks();
      stream.getVideoTracks().forEach(function (t) { t.enabled = false; });
      if (ac.state === 'suspended') ac.resume();
      if (!at.length) {
        $('srcInfo').textContent = 'No sound came with that share. Choose Entire Screen and tick Share system audio.';
        return;
      }
      stopSource();
      var node = ac.createMediaStreamSource(new MediaStream(at));
      node.connect(an);
      srcNode = node;
      sysTracks = stream.getTracks();
      var onEnd = function () {
        if (source === 'sys') { stopSource(); setSource('mouse', 'System sound sharing stopped.'); }
      };
      stream.getTracks().forEach(function (t) { t.addEventListener('ended', onEnd); });
      silentT = 0; silentShown = false;
      setSource('sys', 'Listening to system sound (' + (at[0].label || 'shared audio') + ').');
    }).catch(function (err) {
      $('srcInfo').textContent = 'Sharing did not start: ' + ((err && err.name) || 'error') +
        (err && err.message ? ' (' + err.message + ')' : '') + '. Inside a frame: ' + (window.top !== window) + '.';
    });
  }
  function loadFile(f) {
    if (!ensureAc()) { $('srcInfo').textContent = 'This browser has no Web Audio.'; return; }
    $('srcInfo').textContent = 'Decoding ' + f.name + '...';
    f.arrayBuffer().then(function (b) { return ac.decodeAudioData(b); }).then(function (buf) {
      stopSource();
      srcNode = ac.createBufferSource();
      srcNode.buffer = buf;
      srcNode.loop = true;
      srcNode.connect(bus);
      srcNode.start();
      setSource('file', 'Playing ' + f.name + ' on loop.');
    }).catch(function () {
      $('srcInfo').textContent = 'Could not decode that file. Try MP3, WAV, M4A or OGG.';
    });
  }

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function randn() { return (Math.random() + Math.random() + Math.random() - 1.5) * 2; }
  // Turn the spectrum into three numbers: steer (where the tone sits), kick (bass jumps), shimmer (treble jumps).
  function updateInputs(dt) {
    if (source === 'mouse' || !an) { inp.steer = mouse; inp.kick = 0; inp.shimmer = 0; inp.level = 0.667; return; }
    an.getByteFrequencyData(fdata);
    var bw = ac.sampleRate / an.fftSize, nb = fdata.length - 1;
    var b0 = Math.max(1, Math.round(30 / bw)), b1 = Math.max(b0 + 1, Math.round(150 / bw));
    var t0 = Math.round(4000 / bw), t1 = Math.min(nb, Math.round(12000 / bw));
    var c1 = Math.min(nb, Math.round(8000 / bw));
    var i, sb = 0, st = 0, num = 0, den = 0;
    for (i = b0; i <= b1; i++) sb += fdata[i];
    for (i = t0; i <= t1; i++) st += fdata[i];
    for (i = b0; i <= c1; i++) { num += Math.log(i * bw) * fdata[i]; den += fdata[i]; }
    var bass = sb / ((b1 - b0 + 1) * 255), treb = t1 >= t0 ? st / ((t1 - t0 + 1) * 255) : 0;

    if (source === 'sys') {
      if (den < 200) {
        silentT += dt;
        if (silentT > 3 && !silentShown) {
          silentShown = true;
          $('srcInfo').textContent = 'Connected, but hearing silence. Is something playing? On Windows, sound is only shared with Entire Screen and Share system audio ticked.';
        }
      } else {
        silentT = 0;
        if (silentShown) { silentShown = false; $('srcInfo').textContent = 'Listening to system sound.'; }
      }
    }
    bassAvg += (bass - bassAvg) * Math.min(1, dt * 1.5);
    trebAvg += (treb - trebAvg) * Math.min(1, dt * 1.5);
    kickEnv = Math.max(clamp01((bass - bassAvg) * 3.5), kickEnv * Math.exp(-dt * 7));
    trebEnv = Math.max(clamp01((treb - trebAvg) * 5), trebEnv * Math.exp(-dt * 10));
    inp.kick = kickEnv;
    inp.shimmer = trebEnv;

    // Loudness: overall level relative to the recent loudest moment.
    var Lraw = den / ((c1 - b0 + 1) * 255);
    Lpeak = Math.max(Lraw, Lpeak * Math.exp(-dt * 0.03));
    Ls += (Lraw / (Lpeak + 0.02) - Ls) * Math.min(1, dt * 0.8);
    inp.level = Ls;

    // Steering is a slow drunken walk. The sound only nudges it: where the tone sits
    // pushes the walk a little, and louder music makes the walk a little livelier.
    var dev = 0;
    if (den > 200) {
      var cen = num / den;
      if (cenAvg === null) cenAvg = cen;
      cenAvg += (cen - cenAvg) * Math.min(1, dt * 0.4);
      cenDev += (Math.abs(cen - cenAvg) - cenDev) * Math.min(1, dt * 0.4);
      dev = Math.max(-1, Math.min(1, (cen - cenAvg) / (3 * cenDev + 0.08)));
    }
    oscS += (dev - oscS) * Math.min(1, dt * 3);
    walk += (-0.08 * walk + 0.015 * dev) * dt + 0.015 * Math.sqrt(dt) * (0.4 + 1.2 * Ls) * randn();
    steerS = clamp01(0.5 + (oscS * 0.3 + walk) * steerSens);
    inp.steer = steerS;
  }

  // ---- loop: simulate at simHz, draw at the display rate ----
  function tick(dt) {
    var t = prev; prev = curr; curr = t;
    modes[mode].compute(curr, dt);
    simTime += dt;
  }
  function renderFrame(al, fd) {
    AL = smooth ? al : 1;
    CT = (simTime + AL * (1 / simHz)) * 40;
    modes[mode].render(fd);
    $('read').textContent = modes[mode].read;
  }
  function meters() {
    $('mb').style.width = (inp.kick * 100).toFixed(0) + '%';
    $('ms').style.width = (inp.steer * 100).toFixed(0) + '%';
    $('mt').style.width = (inp.shimmer * 100).toFixed(0) + '%';
    $('ml').style.width = (inp.level * 100).toFixed(0) + '%';
  }
  function loop(now) {
    requestAnimationFrame(loop);
    if (!lastNow) lastNow = now;
    var dt = Math.min(0.1, (now - lastNow) / 1000);
    lastNow = now;
    if (paused) return;
    updateInputs(dt);
    var tickDt = 1 / simHz, ticked = false, guard = 0;
    acc += dt;
    since += dt;
    while (acc >= tickDt && guard++ < 6) { tick(tickDt); acc -= tickDt; ticked = true; }
    if (guard >= 6) acc = 0;
    if (smooth) { renderFrame(acc / tickDt, since); since = 0; }
    else if (ticked) { renderFrame(1, since); since = 0; }
    meters();
  }

  function clearBlack() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }
  function setMode(i) {
    mode = i;
    modes[i].init();
    simTime = 0; acc = 0; since = 0;
    modes[i].compute(curr, 0);
    copyCurrToPrev();
    clearBlack();
    tabButtons.forEach(function (b, j) { b.setAttribute('aria-pressed', j === i ? 'true' : 'false'); });
    $('blurb').textContent = modes[i].blurb;
    renderFrame(1, 0.025);
  }
  function resize() {
    var d = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * d);
    cv.height = Math.round(H * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    clearBlack();
    modes[mode].compute(curr, 0);
    copyCurrToPrev();
    renderFrame(1, 0.025);
  }
  function toggleFs() {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
  }
  var idleT = null;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(function () { document.body.classList.add('idle'); }, 4000);
  }
  function togglePause() {
    paused = !paused;
    if (ac) { if (paused) ac.suspend(); else ac.resume(); }
  }

  // ---- wiring ----
  var tabButtons = modes.map(function (m, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '<kbd>' + (i + 1) + '</kbd>' + m.name;
    b.addEventListener('click', function () { setMode(i); b.blur(); });
    $('tabs').appendChild(b);
    return b;
  });
  $('src-mouse').addEventListener('click', function () {
    stopSource();
    setSource('mouse', 'Pointer left and right steers. Demo beat and audio files play sound.');
  });
  $('src-demo').addEventListener('click', startDemo);
  $('src-file').addEventListener('click', function () { $('file').click(); });
  $('src-sys').addEventListener('click', function () {
    try { startSystem(); } catch (e) { $('srcInfo').textContent = 'Error: ' + e.message; }
  });
  $('file').addEventListener('change', function () {
    var f = $('file').files[0];
    if (f) loadFile(f);
    $('file').value = '';
  });
  $('smooth').addEventListener('change', function () { smooth = this.checked; });
  $('rate').addEventListener('input', function () {
    simHz = parseInt(this.value, 10);
    $('rateOut').textContent = simHz;
  });
  $('gain').addEventListener('input', function () {
    gain = parseInt(this.value, 10) / 100;
    $('gainOut').textContent = gain.toFixed(1);
  });
  $('steerSens').addEventListener('input', function () {
    steerSens = parseInt(this.value, 10) / 100;
    $('steerOut').textContent = steerSens.toFixed(1);
  });
  $('fill').addEventListener('input', function () {
    fill = parseInt(this.value, 10) / 100;
    $('fillOut').textContent = this.value;
  });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFile(f);
  });
  function setMouse(e) { mouse = Math.max(0, Math.min(1, e.clientX / W)); wake(); }
  window.addEventListener('keydown', wake);
  window.addEventListener('pointermove', setMouse);
  window.addEventListener('pointerdown', setMouse);
  cv.addEventListener('click', togglePause);
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') { e.preventDefault(); togglePause(); }
    if ((e.key === 'f' || e.key === 'F') && e.target.tagName !== 'INPUT') toggleFs();
    var k = parseInt(e.key, 10);
    if (k >= 1 && k <= modes.length && e.target.tagName !== 'INPUT') setMode(k - 1);
  });
  window.addEventListener('resize', resize);

  resize();
  wake();
  setMode(mode);
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
