<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Greatest common factor</title>
<link rel="stylesheet" href="common.css">
<style>
  :root {
    --a: var(--blue);
    --b: var(--teal);
    --c: var(--purple);
    --over: var(--red);
    --g: var(--gold);
  }

  /* portrait order: header, picture, pickers */
  .top     { order: 0; }
  .stage   { order: 1; }
  .pickers { order: 2; }

  /* A and B side by side, C underneath; one column in the landscape sidebar */
  .pickers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .picker.a { --hue: var(--a); }
  .picker.b { --hue: var(--b); }
  .picker.c { --hue: var(--c); grid-column: 1 / -1; }
  @media (orientation: landscape) and (min-width: 700px) {
    .pickers { grid-template-columns: 1fr; }
    .picker.c { grid-column: auto; }
  }
  @media (max-width: 400px) { .picker input[type=number] { font-size: 26px; } .pm { width: 42px; height: 42px; } }

  /* ---- the picture ---- */
  #pic { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #pic text { font: 700 13px ui-sans-serif, system-ui, sans-serif; font-variant-numeric: tabular-nums; }

  /* the "show gcf" toggle on the picture */
  #gbtn[aria-pressed=true] { border-color: var(--g); box-shadow: 0 0 0 1.5px var(--g), var(--shadow); font-weight: 650; }
  #gbtn .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px;
              border: 2px dashed var(--g); }

  /* the dots in the Options panel */
  .colors .swatch.a { --hue: var(--a); } .colors .swatch.b { --hue: var(--b); } .colors .swatch.c { --hue: var(--c); }
  .colors .swatch.over { --hue: var(--over); } .colors .swatch.g { --hue: var(--g); }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <svg id="pic" role="img" aria-label="a rectangle tiled with squares"></svg>
    <button class="float-btn" id="gbtn" aria-pressed="false"><span class="sw"></span><span id="gtxt">show gcf</span></button>
  </div>

  <div class="side">
    <div class="top">
      <a class="back" href="./" aria-label="home">←</a>
      <h1>Greatest common factor <span>· tile a rectangle with squares</span></h1>
      <button class="gear" id="gear" aria-expanded="false" aria-controls="opts">⚙ Options</button>
    </div>

    <div class="panel opts pop" id="opts" hidden>
      <div class="opt">
        <span class="k">colors</span>
        <div class="colors">
          <span class="swatch a"><span class="dot"><input type="color" data-k="a" aria-label="color for A"></span>A</span>
          <span class="swatch b"><span class="dot"><input type="color" data-k="b" aria-label="color for B"></span>B</span>
          <span class="swatch c"><span class="dot"><input type="color" data-k="c" aria-label="color for C"></span>C</span>
          <span class="swatch over"><span class="dot"><input type="color" data-k="over" aria-label="color for the overflow"></span>overflow</span>
          <span class="swatch g"><span class="dot"><input type="color" data-k="g" aria-label="color for the gcf"></span>gcf</span>
          <button class="mini" id="creset">reset</button>
        </div>
      </div>
    </div>

    <div class="pickers">
      <div class="picker a" id="pa">
        <span class="tag"><b>A</b> · width</span>
        <span class="dot" title="pick a color"><input type="color" data-k="a" aria-label="color for A"></span>
        <button class="pm" data-d="-1" aria-label="decrease A"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <input type="number" min="1" max="999" value="12" inputmode="numeric" aria-label="A, the width">
        <button class="pm" data-d="1" aria-label="increase A"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
      </div>
      <div class="picker b" id="pb">
        <span class="tag"><b>B</b> · height</span>
        <span class="dot" title="pick a color"><input type="color" data-k="b" aria-label="color for B"></span>
        <button class="pm" data-d="-1" aria-label="decrease B"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <input type="number" min="1" max="999" value="8" inputmode="numeric" aria-label="B, the height">
        <button class="pm" data-d="1" aria-label="increase B"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
      </div>
      <div class="picker c" id="pc">
        <span class="tag"><b>C</b> · square side (your guess)</span>
        <span class="dot" title="pick a color"><input type="color" data-k="c" aria-label="color for C"></span>
        <button class="pm" data-d="-1" aria-label="decrease C"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <input type="number" min="1" max="999" value="3" inputmode="numeric" aria-label="C, the side of each square">
        <button class="pm" data-d="1" aria-label="increase C"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
      </div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
(() => {
  'use strict';

  const { $, gcd, numberPicker, colorPicker, popovers } = doodle;
  const NS = 'http://www.w3.org/2000/svg';

  const st = { a: 12, b: 8, c: 3, showG: false };
  const pic = $('pic');

  // ---- drawing ------------------------------------------------------------------
  // The rectangle is A wide and B tall, bottom-left corner at the origin.
  // Squares of side C are laid from that corner: enough columns to cover A and
  // enough rows to cover B. Whatever pokes past the right or top edge is overflow.
  function el(tag, attrs, parent = pic) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }

  function draw() {
    const { a, b, c } = st;
    const W = pic.clientWidth, H = pic.clientHeight;
    if (!W || !H) return;
    pic.setAttribute('viewBox', `0 0 ${W} ${H}`);
    pic.replaceChildren();

    const nx = Math.ceil(a / c), ny = Math.ceil(b / c);   // squares across, squares up
    const tw = nx * c, th = ny * c;                         // how far the tiles reach
    // room for the A label underneath and the B label on the left
    const L = 40, R = 16, T = 16, Bm = 38;
    const s = Math.min((W - L - R) / tw, (H - T - Bm) / th);  // pixels per unit
    const ox = L + (W - L - R - tw * s) / 2, oy = T + (H - T - Bm - th * s) / 2 + th * s;  // screen spot of (0, 0)
    const X = u => ox + u * s, Y = v => oy - v * s;

    // the rectangle itself
    el('rect', { x: X(0), y: Y(b), width: a * s, height: b * s, fill: 'var(--panel-solid)' });

    // checkerboard the squares (when there aren't so many it turns to mush)
    const cs = c * s;
    if (cs >= 6 && nx * ny <= 40000) {
      let d = '';
      for (let j = 0; j < ny; j++)
        for (let i = (j % 2); i < nx; i += 2)
          d += `M${X(i * c)} ${Y((j + 1) * c)}h${cs}v${cs}h${-cs}z`;
      el('path', { d, fill: 'var(--c)', 'fill-opacity': .13 });
    }

    // overflow: the strip past the right edge, and the strip above the top edge
    const over = { fill: 'var(--over)', 'fill-opacity': .2 };
    if (tw > a) el('rect', { x: X(a), y: Y(th), width: (tw - a) * s, height: th * s, ...over });
    if (th > b) el('rect', { x: X(0), y: Y(th), width: a * s, height: (th - b) * s, ...over });

    // square outlines: one line at every multiple of C (skipped when they'd be a blur)
    if (cs >= 3) {
      let d = '';
      for (let i = 0; i <= nx; i++) d += `M${X(i * c)} ${Y(0)}V${Y(th)}`;
      for (let j = 0; j <= ny; j++) d += `M${X(0)} ${Y(j * c)}H${X(tw)}`;
      el('path', { d, stroke: 'var(--c)', 'stroke-opacity': cs >= 12 ? .7 : .35, 'stroke-width': cs >= 12 ? 1.5 : 1, fill: 'none' });
    }

    // the gcf overlay: the biggest square that tiles the rectangle exactly, dashed in gold,
    // with the one in the corner filled in so its size is easy to see
    if (st.showG) {
      const g = gcd(a, b), gs = g * s;
      el('rect', { x: X(0), y: Y(g), width: gs, height: gs, fill: 'var(--g)', 'fill-opacity': .3 });
      if (gs >= 4) {
        let d = '';
        for (let i = 1; i < a / g; i++) d += `M${X(i * g)} ${Y(0)}V${Y(b)}`;
        for (let j = 1; j < b / g; j++) d += `M${X(0)} ${Y(j * g)}H${X(a)}`;
        el('path', { d, stroke: 'var(--g)', 'stroke-width': 2.5, 'stroke-dasharray': '7 5', fill: 'none' });
      }
      el('rect', { x: X(0), y: Y(g), width: gs, height: gs, fill: 'none', stroke: 'var(--g)', 'stroke-width': 2.5 });
    }

    // the rectangle's edge, drawn last so it sits on top
    el('rect', { x: X(0), y: Y(b), width: a * s, height: b * s, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 2.5 });

    // side labels
    el('text', { x: X(a / 2), y: Y(0) + 24, fill: 'var(--a)', 'text-anchor': 'middle' }).textContent = `A = ${a}`;
    el('text', { x: X(0) - 14, y: Y(b / 2), fill: 'var(--b)', 'text-anchor': 'middle',
                 transform: `rotate(-90 ${X(0) - 14} ${Y(b / 2)})`, 'dominant-baseline': 'middle' }).textContent = `B = ${b}`;
  }

  // ---- controls -----------------------------------------------------------------
  for (const key of ['a', 'b', 'c'])
    numberPicker($('p' + key), { get: () => st[key], onChange: v => { st[key] = v; draw(); label(); } });

  const gbtn = $('gbtn');
  const label = () => { $('gtxt').textContent = st.showG ? `gcf = ${gcd(st.a, st.b)}` : 'show gcf'; };
  gbtn.addEventListener('click', () => {
    st.showG = !st.showG; gbtn.setAttribute('aria-pressed', st.showG); label(); draw();
  });

  popovers([[$('gear'), $('opts')]]);
  $('creset').addEventListener('click', colorPicker('gcf.colors', ['a', 'b', 'c', 'over', 'g']).reset);

  new ResizeObserver(draw).observe($('stage'));
})();
</script>
</body>
</html>
