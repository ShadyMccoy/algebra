<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multiples grid</title>
<link rel="stylesheet" href="common.css">
<style>
  :root {
    --a: var(--red);
    --b: var(--blue);
    --ab: var(--purple);
    --lcm: var(--gold);
    --w: var(--slate);
    --cell: var(--panel-solid);
  }

  /* portrait order: header, pickers, grid (fills the rest), row length.
     The legend lives in a pop-over behind the ⓘ button. */
  .top     { order: 0; }
  .pickers { order: 1; }
  .stage   { order: 2; }
  .rowlen  { order: 3; }

  @media (orientation: landscape) and (min-width: 700px) {
    .pickers { flex-direction: column; }
    .opts { position: static !important; max-height: none !important; }
  }

  /* ---- the two number pickers ---- */
  .pickers { display: flex; gap: 10px; }
  .picker.a { --hue: var(--a); }
  .picker.b { --hue: var(--b); }

  /* a colour dot you can tap to pick that number's colour */
  .dot {
    position: relative; flex: none; width: 28px; height: 28px; border-radius: 999px;
    background: var(--hue); cursor: pointer;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.55), 0 1px 3px rgba(0,0,0,.2);
  }
  .dot.ab { --hue: var(--ab); }
  .dot input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
  .dot::after {   /* little paint-drop hint */
    content: ""; position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 999px;
    background: conic-gradient(#ef4444, #f59e0b, #22c55e, #3b82f6, #a855f7, #ef4444);
    box-shadow: 0 0 0 2px var(--panel-solid);
  }
  @media (max-width: 400px) { .picker .dot { display: none; } }

  /* ---- options ---- */
  .opts {
    position: absolute; z-index: 5; top: calc(max(10px, env(safe-area-inset-top)) + 44px);
    right: max(12px, env(safe-area-inset-right)); width: min(440px, calc(100% - 24px));
    max-height: 70vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px;
    background: var(--panel-solid);
  }
  /* the legend + explanation: always a pop-over behind the ⓘ button, so the grid gets the room */
  .info {
    position: absolute; z-index: 5; top: calc(max(10px, env(safe-area-inset-top)) + 44px);
    right: max(12px, env(safe-area-inset-right)); width: min(440px, calc(100% - 24px));
    max-height: 70vh; overflow-y: auto;
    background: var(--panel-solid);
  }
  .opt { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
  .opt > .k { color: var(--ink-dim); font-size: 12px; width: 62px; flex: none; }
  .chk input { accent-color: var(--ab); }
  .colors { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .colors .c { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; }
  .colors .c.a { --hue: var(--a); } .colors .c.b { --hue: var(--b); }

  /* ---- the canvas ---- */
  #c { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #c.dragging { cursor: grabbing; }
  .readout {
    position: absolute; left: 10px; top: 10px; pointer-events: none; max-width: calc(100% - 20px);
    background: var(--panel); border: 1px solid var(--panel-brd); border-radius: 9px;
    padding: 4px 10px; font-size: 13px; font-variant-numeric: tabular-nums;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .readout:empty { display: none; }
  .readout.hint { color: var(--ink-dim); }
  .fit {
    position: absolute; right: 10px; bottom: 10px;
    font: inherit; font-size: 12.5px; color: var(--ink); cursor: pointer;
    padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--panel-brd); background: var(--panel); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }

  /* ---- row length ---- */
  .rowlen { --hue: var(--w); display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 10px; }
  .rl-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .rl-head .k { font-weight: 650; font-size: 13.5px; }
  .rl-head .seg { margin-left: auto; }
  .rl-head .mini { padding: 6px 11px; }
  .rl-ctl { display: flex; align-items: center; gap: 10px; }
  .numbox {
    font: inherit; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink);
    width: 62px; padding: 4px 8px; text-align: center;
    background: color-mix(in srgb, var(--ink) 6%, transparent);
    border: 1px solid transparent; border-radius: 8px;
    -moz-appearance: textfield; appearance: textfield;
  }
  .numbox:focus { outline: none; border-color: var(--ink-dim); }
  .numbox::-webkit-inner-spin-button, .numbox::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  /* custom slider: tap anywhere to jump, drag anywhere to slide, value shown in the knob */
  .slider { position: relative; flex: 1; height: 62px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
  .slider:focus { outline: none; }
  .slider .track {
    position: absolute; left: 22px; right: 22px; top: 25px; height: 14px; margin-top: -7px;
    border-radius: 999px; background: color-mix(in srgb, var(--ink) 12%, transparent);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.15);
  }
  .slider .fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--p) * 100%);
    border-radius: inherit; background: var(--hue);
  }
  .slider .knob {
    position: absolute; top: 25px; left: calc(22px + var(--p) * (100% - 44px));
    width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 999px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; color: #fff;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--hue) 65%, #fff), var(--hue) 60%);
    box-shadow: 0 3px 0 color-mix(in srgb, var(--hue) 62%, #000), 0 5px 12px rgba(0,0,0,.2);
    transition: transform .08s;
  }
  .slider.active .knob { transform: scale(1.12); }
  .slider:focus-visible .knob { outline: 3px solid color-mix(in srgb, var(--hue) 45%, transparent); outline-offset: 2px; }
  .slider .ends {
    position: absolute; left: 22px; right: 22px; bottom: 0;
    display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-dim); pointer-events: none;
  }

  /* ---- legend ---- */
  .info { padding: 8px 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; }
  .legend .item { display: flex; align-items: center; gap: 7px; }
  .legend b { font-variant-numeric: tabular-nums; }
  .chip { width: 16px; height: 16px; border-radius: 4px; background-color: var(--cell); }
  .chip.lcm { box-shadow: 0 0 0 2.5px var(--lcm); }
  .legend {
    --sa: repeating-linear-gradient(45deg, var(--a) 0 3px, transparent 3px 6px);
    --sb: repeating-linear-gradient(-45deg, var(--b) 0 3px, transparent 3px 6px);
  }
  .legend[data-scheme=hatch]  .a  { background-image: var(--sa); }
  .legend[data-scheme=hatch]  .b  { background-image: var(--sb); }
  .legend[data-scheme=hatch]  .ab { background-image: var(--sa), var(--sb); }
  .legend[data-scheme=purple] .a  { background-image: var(--sa); }
  .legend[data-scheme=purple] .b  { background-image: var(--sb); }
  .legend[data-scheme=purple] .ab { background-color: var(--ab); }
  .legend[data-scheme=alt] .a  { background-image: repeating-linear-gradient(-45deg, var(--a) 0 3px, transparent 3px 6px); }
  .legend[data-scheme=alt] .b  { background-image: repeating-linear-gradient(-45deg, var(--b) 0 3px, transparent 3px 6px); }
  .legend[data-scheme=alt] .ab { background-image: repeating-linear-gradient(-45deg, var(--a) 0 3px, var(--b) 3px 6px); }
  .legend[data-scheme=solid] .a  { background-color: var(--a); }
  .legend[data-scheme=solid] .b  { background-color: var(--b); }
  .legend[data-scheme=solid] .ab { background-color: var(--ab); }
  .legend[data-scheme=split] .a  { background-color: var(--a); }
  .legend[data-scheme=split] .b  { background-color: var(--b); }
  .legend[data-scheme=split] .ab { background-image: linear-gradient(135deg, var(--a) 50%, var(--b) 50%); }
  .note { margin-top: 6px; color: var(--ink-dim); font-size: 12.5px; }
  .note b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .note .l { color: var(--ink); background: color-mix(in srgb, var(--lcm) 30%, transparent); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="readout hint" id="readout">drag to move · pinch or ctrl+scroll to zoom · tap a square</div>
    <button class="fit" id="fit" title="fit the rows to the screen">⤢ fit</button>
  </div>

  <div class="side">
    <div class="top">
      <a class="back" href="./" aria-label="home">←</a>
      <h1>Multiples <span>· pick two numbers, see where they meet</span></h1>
      <button class="gear i" id="infob" aria-expanded="false" aria-controls="info" aria-label="what am I looking at?" title="what am I looking at?">i</button>
      <button class="gear" id="gear" aria-expanded="false" aria-controls="opts">⚙ Options</button>
    </div>

    <div class="panel opts" id="opts" hidden>
      <div class="opt">
        <span class="k">colors</span>
        <div class="colors">
          <span class="c a"><span class="dot"><input type="color" data-k="a" aria-label="color for a"></span>a</span>
          <span class="c b"><span class="dot"><input type="color" data-k="b" aria-label="color for b"></span>b</span>
          <span class="c"><span class="dot ab"><input type="color" data-k="ab" aria-label="color for both"></span>both</span>
          <button class="mini" id="creset">reset</button>
        </div>
      </div>
      <div class="opt">
        <span class="k">pattern</span>
        <div class="seg">
          <input type="radio" name="scheme" id="s-hatch" value="hatch" checked><label for="s-hatch">Crosshatch</label>
          <input type="radio" name="scheme" id="s-purple" value="purple"><label for="s-purple">Stripes + both</label>
          <input type="radio" name="scheme" id="s-alt" value="alt"><label for="s-alt">Stripes</label>
          <input type="radio" name="scheme" id="s-solid" value="solid"><label for="s-solid">Solid</label>
          <input type="radio" name="scheme" id="s-split" value="split"><label for="s-split">Split</label>
        </div>
      </div>
      <div class="opt">
        <span class="k">start at</span>
        <div class="seg">
          <input type="radio" name="start" id="st1" value="1" checked><label for="st1">1</label>
          <input type="radio" name="start" id="st0" value="0"><label for="st0">0</label>
        </div>
      </div>
      <div class="opt">
        <span class="k">show</span>
        <label class="chk"><input type="checkbox" id="o-num" checked> numbers</label>
        <label class="chk"><input type="checkbox" id="o-ring" checked> ring overlaps</label>
        <label class="chk"><input type="checkbox" id="o-focus"> only overlaps</label>
        <label class="chk"><input type="checkbox" id="o-lcm" checked> mark lcm</label>
      </div>
    </div>

    <div class="pickers">
      <div class="picker a" id="pa">
        <span class="dot" title="pick a color"><input type="color" data-k="a" aria-label="color for a"></span>
        <button class="pm" data-d="-1" aria-label="decrease a"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <input type="number" min="1" max="999" value="3" inputmode="numeric" aria-label="a">
        <button class="pm" data-d="1" aria-label="increase a"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
      </div>
      <div class="picker b" id="pb">
        <span class="dot" title="pick a color"><input type="color" data-k="b" aria-label="color for b"></span>
        <button class="pm" data-d="-1" aria-label="decrease b"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <input type="number" min="1" max="999" value="4" inputmode="numeric" aria-label="b">
        <button class="pm" data-d="1" aria-label="increase b"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
      </div>
    </div>

    <div class="panel rowlen">
      <div class="rl-head">
        <span class="k">row length</span>
        <input type="number" class="numbox" id="wbox" min="1" max="999" value="10" inputmode="numeric" aria-label="row length">
        <div class="seg">
          <button class="mini" data-w="10">10</button>
          <button class="mini" data-w="a">= a</button>
          <button class="mini" data-w="b">= b</button>
          <button class="mini" data-w="lcm">= lcm</button>
        </div>
      </div>
      <div class="rl-ctl">
        <button class="pm" id="wminus" aria-label="shorter rows"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <div class="slider" id="wslider" role="slider" tabindex="0" aria-label="row length" aria-valuemin="1">
          <div class="track"><div class="fill"></div></div>
          <div class="knob" id="wknob">10</div>
          <div class="ends"><span>1</span><span id="wmax"></span></div>
        </div>
        <button class="pm" id="wplus" aria-label="longer rows"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
      </div>
    </div>

    <div class="panel info" id="info" hidden>
      <div class="legend" id="legend" data-scheme="hatch">
        <span class="item"><span class="chip a"></span>multiples of <b id="la">3</b></span>
        <span class="item"><span class="chip b"></span>multiples of <b id="lb">4</b></span>
        <span class="item"><span class="chip ab"></span>both</span>
        <span class="item" id="llcm"><span class="chip ab lcm"></span>lcm = <b id="ll">12</b></span>
      </div>
      <div class="note" id="note"></div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
(() => {
  'use strict';

  const { $, clamp, gcd, holdRepeat, numberPicker } = doodle;

  const MIN_CELL = 2, MAX_CELL = 160;     // cell size limits in CSS px
  const FIT_CELL = 90;                    // biggest cell "fit" will pick
  const MARGIN = 14;                      // breathing room around the grid edge
  const SL_MAX = 60;                      // right end of the row-length slider (the box takes bigger values)
  const st = {
    a: 3, b: 4, start: 1, w: 10,
    scheme: 'hatch', nums: true, ring: true, focus: false, markLcm: true,
    cw: 40, ch: 40,       // cell width / height in CSS px
    px: 0, py: 0,         // the (column, row) shown at the bottom-left corner of the view
    fitted: true,         // view is "rows fill the width" — keep it that way on resize
    hover: null
  };

  const cv = $('c'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  let col = {};          // colors read from CSS
  let pats = {};         // stripe patterns

  // ---- user-picked colors (kept in this browser only) ----------------------------
  const CKEYS = ['a', 'b', 'ab'];
  let custom = {};
  try { custom = JSON.parse(localStorage.getItem('multiples.colors')) || {}; } catch (e) { custom = {}; }
  function applyCustom() {
    const rs = document.documentElement.style;
    for (const k of CKEYS) custom[k] ? rs.setProperty('--' + k, custom[k]) : rs.removeProperty('--' + k);
    try { localStorage.setItem('multiples.colors', JSON.stringify(custom)); } catch (e) {}
    readColors(); req();
  }
  function syncColorInputs() {
    document.querySelectorAll('input[type=color]').forEach(i => { i.value = toHex(col[i.dataset.k]); });
  }
  document.querySelectorAll('input[type=color]').forEach(i => i.addEventListener('input', () => {
    custom[i.dataset.k] = i.value; applyCustom();
  }));
  $('creset').addEventListener('click', () => { custom = {}; applyCustom(); });

  // '#abc' / '#aabbcc' / 'rgb(…)' -> [r, g, b]
  function rgb(c) {
    c = (c || '').trim();
    let m = /^#([0-9a-f]{3})$/i.exec(c);
    if (m) c = '#' + [...m[1]].map(x => x + x).join('');
    m = /^#([0-9a-f]{6})/i.exec(c);
    if (m) { const n = parseInt(m[1], 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
    m = /rgba?\(\s*([\d.]+)[ ,]+([\d.]+)[ ,]+([\d.]+)/.exec(c);
    return m ? [+m[1], +m[2], +m[3]] : [0, 0, 0];
  }
  const toHex = c => '#' + rgb(c).map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
  const lum = c => {
    const [r, g, b] = rgb(c).map(v => { v /= 255; return v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; });
    return .2126 * r + .7152 * g + .0722 * b;
  };
  // white numbers on dark fills, dark numbers on light ones (so a yellow pick stays readable)
  const textOn = L => L > .3 ? '#1c1917' : '#fff';

  // ---- colors and stripe patterns --------------------------------------------
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    for (const k of ['bg', 'panel-brd', 'ink', 'ink-dim', 'a', 'b', 'ab', 'lcm', 'cell'])
      col[k] = cs.getPropertyValue('--' + k).trim();
    col.ta = textOn(lum(col.a)); col.tb = textOn(lum(col.b)); col.tab = textOn(lum(col.ab));
    col.tsplit = textOn((lum(col.a) + lum(col.b)) / 2);
    buildPatterns(); syncColorInputs();
  }
  function tile(draw) {
    const T = 9, S = Math.round(T * dpr);
    const t = document.createElement('canvas');
    t.width = t.height = S;
    const g = t.getContext('2d');
    draw(g, S);
    const p = ctx.createPattern(t, 'repeat');
    p.T = T; p.S = S;
    return p;
  }
  const lines = (g, S, color, w, dir) => {
    g.strokeStyle = color; g.lineWidth = w; g.beginPath();
    for (let k = -1; k <= 1; k++) {
      if (dir > 0) { g.moveTo(k * S, S); g.lineTo(k * S + S, 0); }   // ╱
      else         { g.moveTo(k * S, 0); g.lineTo(k * S + S, S); }   // ╲
    }
    g.stroke();
  };
  function buildPatterns() {
    pats = {
      aUp:   tile((g, S) => lines(g, S, col.a, S * .32, 1)),
      bDown: tile((g, S) => lines(g, S, col.b, S * .32, -1)),
      aUp2:  tile((g, S) => lines(g, S, col.a, S * .32, 1)),
      bUp:   tile((g, S) => lines(g, S, col.b, S * .32, 1)),
      abUp:  tile((g, S) => { g.fillStyle = col.b; g.fillRect(0, 0, S, S); lines(g, S, col.a, S / (2 * Math.SQRT2), 1); })
    };
  }

  // ---- view geometry ------------------------------------------------------------
  // column c, row r (row 0 at the bottom) -> top-left corner on screen
  const sx = c => (c - st.px) * st.cw;
  const sy = r => H - (r - st.py + 1) * st.ch;

  function clampPan() {
    const minX = -MARGIN / st.cw, minY = -MARGIN / st.ch;
    const maxX = Math.max(minX, st.w - (W - MARGIN) / st.cw);
    // a row narrower than the view sits in the middle; a wider one can slide side to side
    st.px = st.w * st.cw <= W - 2 * MARGIN ? -(W - st.w * st.cw) / 2 / st.cw : clamp(st.px, minX, maxX);
    st.py = clamp(st.py, minY, 1e7);
  }

  // scale cells by f, keeping the grid point under (mx, my) fixed
  function zoomAt(f, mx, my) {
    const gx = st.px + mx / st.cw, gy = st.py + (H - my) / st.ch;
    st.cw = clamp(st.cw * f, MIN_CELL, MAX_CELL);
    st.ch = clamp(st.ch * f, MIN_CELL, MAX_CELL);
    st.px = gx - mx / st.cw;
    st.py = gy - (H - my) / st.ch;
    st.fitted = false;
    clampPan(); req();
  }

  // square cells, sized so a whole row fits across, starting from the first number
  function fit() {
    if (!W) return;
    const s = clamp(Math.min((W - 2 * MARGIN) / st.w, FIT_CELL), MIN_CELL, MAX_CELL);
    st.cw = st.ch = s;
    st.px = -MARGIN / s; st.py = -MARGIN / s;
    st.fitted = true;
    clampPan(); req();
  }

  // ---- drawing ------------------------------------------------------------------
  let queued = false;
  const req = () => { if (!queued) { queued = true; requestAnimationFrame(draw); } };

  function kind(n) {
    const ma = n % st.a === 0, mb = n % st.b === 0;
    return ma && mb ? 3 : ma ? 1 : mb ? 2 : 0;
  }

  function fillCell(k, x, y, w, h, small) {
    const s = st.scheme;
    if (small || s === 'solid') {
      ctx.fillStyle = k === 1 ? col.a : k === 2 ? col.b : col.ab;
      if (small) {
        // snap tiny cells to whole device pixels so neighbours meet without hairline seams
        const snap = v => Math.round(v * dpr) / dpr;
        const x0 = snap(x), y0 = snap(y);
        ctx.fillRect(x0, y0, snap(x + w) - x0, snap(y + h) - y0); return;
      }
      ctx.fillRect(x, y, w, h); return;
    }
    if (s === 'split') {
      if (k === 3) {
        ctx.fillStyle = col.a; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x, y + h); ctx.fill();
        ctx.fillStyle = col.b; ctx.beginPath(); ctx.moveTo(x + w, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.fill();
      } else { ctx.fillStyle = k === 1 ? col.a : col.b; ctx.fillRect(x, y, w, h); }
      return;
    }
    ctx.fillStyle = col.cell; ctx.fillRect(x, y, w, h);
    const use = p => { ctx.fillStyle = p; ctx.fillRect(x, y, w, h); };
    if (s === 'hatch')  { if (k & 1) use(pats.aUp);  if (k & 2) use(pats.bDown); }
    if (s === 'purple') { if (k === 3) { ctx.fillStyle = col.ab; ctx.fillRect(x, y, w, h); } else use(k === 1 ? pats.aUp : pats.bDown); }
    if (s === 'alt')    use(k === 1 ? pats.aUp2 : k === 2 ? pats.bUp : pats.abUp);
  }

  function draw() {
    queued = false;
    const { a, b, start, w, cw, ch } = st;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = col.bg; ctx.fillRect(0, 0, W, H);

    // anchor the stripe patterns to the grid so they slide with it while panning
    const ox = -st.px * cw, oy = H + st.py * ch;
    for (const p of Object.values(pats)) p.setTransform(new DOMMatrix().translate(ox, oy).scale(1 / dpr));

    const c0 = Math.max(0, Math.floor(st.px)), c1 = Math.min(w - 1, Math.floor(st.px + W / cw));
    const r0 = Math.max(0, Math.floor(st.py)), r1 = Math.floor(st.py + H / ch);
    const small = Math.min(cw, ch) < 10;
    const gap = small ? 0 : Math.min(4, Math.min(cw, ch) * .1);
    const rad = small ? 0 : Math.min(6, Math.min(cw, ch) * .18);
    const iw = cw - gap, ih = ch - gap;

    // the grid's own background (covers blank cells when they're too small to outline)
    if (small) {
      ctx.fillStyle = col.cell;
      const top = Math.max(0, sy(r1)), x0 = sx(c0), x1 = sx(c1 + 1);
      ctx.fillRect(x0, top, x1 - x0, sy(r0) + ch - top);
    }

    const g = gcd(a, b), l = a / g * b;
    const fs = Math.min(ch * .42, (cw - 4) / 3.4, 22);  // sized so 3-digit numbers fit; grows no further
    const filled = small || st.scheme === 'solid' || st.scheme === 'split';   // numbers sit straight on the color
    let lcmCell = null;

    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        const n = start + r * w + c;
        const k = kind(n);
        const x = sx(c) + gap / 2, y = sy(r) + gap / 2;
        if (n === l) lcmCell = { x, y };
        if (k === 0 && small) continue;
        ctx.globalAlpha = st.focus && k !== 3 ? .25 : 1;

        ctx.save();
        if (!small) { ctx.beginPath(); ctx.roundRect(x, y, iw, ih, rad); ctx.clip(); }
        if (k === 0) { ctx.fillStyle = col.cell; ctx.fillRect(x, y, iw, ih); }
        else fillCell(k, x, y, iw, ih, small);
        ctx.restore();

        if (!small) {
          ctx.lineWidth = 1;
          if (k === 0) { ctx.strokeStyle = col['panel-brd']; ctx.beginPath(); ctx.roundRect(x + .5, y + .5, iw - 1, ih - 1, rad); ctx.stroke(); }
          if (k === 3 && st.ring) { ctx.strokeStyle = col.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x + 1, y + 1, iw - 2, ih - 2, Math.max(0, rad - 1)); ctx.stroke(); }
        }

        if (st.nums && fs >= 7.5) {
          const t = String(n);
          const f = Math.min(fs, (cw - 4) / (t.length * .62));
          if (f >= 6.5) {
            ctx.font = `600 ${f}px ui-sans-serif, system-ui, sans-serif`;
            const cx = x + iw / 2, cy = y + ih / 2;
            if (k !== 0 && !filled) {
              const tw = ctx.measureText(t).width;
              ctx.fillStyle = col.cell; ctx.globalAlpha *= .88;
              ctx.beginPath(); ctx.roundRect(cx - tw / 2 - 3, cy - f * .62, tw + 6, f * 1.24, 4); ctx.fill();
              ctx.globalAlpha = st.focus && k !== 3 ? .25 : 1;
            }
            ctx.fillStyle = k === 0 ? col['ink-dim'] : !filled ? col.ink
              : k === 1 ? col.ta : k === 2 ? col.tb : st.scheme === 'split' && !small ? col.tsplit : col.tab;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(t, cx, cy + f * .04);
          }
        }
      }
    }
    ctx.globalAlpha = 1;

    // the lcm: a gold ring, plus a label when there's room
    if (st.markLcm && lcmCell && a !== b) {
      const { x, y } = lcmCell;
      ctx.strokeStyle = col.lcm;
      if (small) {
        const R = Math.max(7, Math.min(cw, ch));
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(x + cw / 2, y + ch / 2, R, 0, Math.PI * 2); ctx.stroke();
      } else {
        const lw = Math.max(3, Math.min(cw, ch) * .09);
        ctx.lineWidth = lw;
        ctx.beginPath(); ctx.roundRect(x - lw / 2 - 1, y - lw / 2 - 1, iw + lw + 2, ih + lw + 2, rad + lw / 2); ctx.stroke();
        if (Math.min(cw, ch) >= 22) {
          ctx.font = `700 11px ui-sans-serif, system-ui, sans-serif`;
          const tw = ctx.measureText('lcm').width + 10;
          const tx = x + iw / 2 - tw / 2, ty = y - lw - 13;
          ctx.fillStyle = col.lcm;
          ctx.beginPath(); ctx.roundRect(tx, ty, tw, 15, 7); ctx.fill();
          ctx.fillStyle = '#1c1917'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('lcm', x + iw / 2, ty + 8);
        }
      }
    }

    // hover / tapped-cell outline
    if (st.hover) {
      const { c, r } = st.hover;
      ctx.strokeStyle = col.ink; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
      ctx.strokeRect(sx(c) + .75, sy(r) + .75, cw - 1.5, ch - 1.5);
      ctx.setLineDash([]);
    }
  }

  // ---- text below and above the canvas ------------------------------------------
  function describe() {
    const { a, b, start } = st, g = gcd(a, b), l = a / g * b;
    $('la').textContent = a; $('lb').textContent = b; $('ll').textContent = l;
    $('llcm').style.display = st.markLcm && a !== b ? '' : 'none';
    $('note').innerHTML = a === b
      ? `Same number twice — every multiple overlaps.`
      : `The overlaps are exactly the multiples of <span class="l">${l}</span>, the <b>least common multiple</b>: ` +
        `the smallest number both ${a} and ${b} divide ` +
        (g === 1
          ? `(they share no common factor, so it's just ${a} × ${b}).`
          : `(${a} × ${b} ÷ ${g}, because they share the factor <b>${g}</b>).`) +
        ` So 1 in ${a} squares gets ${a}'s color, 1 in ${b} gets ${b}'s, and 1 in ${l} gets both.` +
        (start === 0 ? ` 0 counts as both: it's 0 × anything.` : '');
    showHover();
  }
  let hinted = true;     // the "how to use" hint shows in the readout until the grid is first touched
  function showHover() {
    const h = st.hover, ro = $('readout');
    if (!h) { if (!hinted) ro.textContent = ''; return; }
    hinted = false; ro.classList.remove('hint');
    const n = st.start + h.r * st.w + h.c, k = kind(n);
    const what = ['', `multiple of ${st.a}`, `multiple of ${st.b}`, `multiple of both`][k];
    ro.textContent = `${n}` + (what ? ` · ${what}` : '') + ` · row ${h.r}, column ${h.c}`;
  }
  function dropHint() { if (hinted) { hinted = false; $('readout').classList.remove('hint'); $('readout').textContent = ''; showHover(); } }

  // ---- controls -----------------------------------------------------------------
  for (const key of ['a', 'b'])
    numberPicker($('p' + key), { get: () => st[key], onChange: v => { st[key] = v; describe(); req(); } });

  // options panel: a pop-over in portrait, inline in the landscape sidebar
  const gear = $('gear'), opts = $('opts');
  const showOpts = on => { opts.hidden = !on; gear.setAttribute('aria-expanded', on); if (on && overlay()) showInfo(false); };
  gear.addEventListener('click', () => showOpts(opts.hidden));
  const overlay = () => getComputedStyle(opts).position === 'absolute';
  // the legend + explanation: a pop-over behind the ⓘ button
  const infob = $('infob'), info = $('info');
  const showInfo = on => { info.hidden = !on; infob.setAttribute('aria-expanded', on); if (on && overlay()) showOpts(false); };
  infob.addEventListener('click', () => showInfo(info.hidden));
  document.addEventListener('pointerdown', e => {
    if (!opts.hidden && overlay() && !opts.contains(e.target) && !gear.contains(e.target)) showOpts(false);
    if (!info.hidden && !info.contains(e.target) && !infob.contains(e.target)) showInfo(false);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!opts.hidden) showOpts(false); showInfo(false); } });

  document.querySelectorAll('input[name=scheme]').forEach(r => r.addEventListener('change', () => {
    st.scheme = $('legend').dataset.scheme = r.value; req();
  }));
  document.querySelectorAll('input[name=start]').forEach(r => r.addEventListener('change', () => {
    st.start = +r.value; describe(); req();
  }));

  // row length: changing it always refits so whole rows stay on screen
  const sl = $('wslider'), knob = $('wknob');
  $('wmax').textContent = SL_MAX;
  sl.setAttribute('aria-valuemax', SL_MAX);
  function setWidth(w) {
    w = clamp(Math.round(w) || 1, 1, 999);
    const changed = w !== st.w;
    st.w = w;
    sl.style.setProperty('--p', (Math.min(w, SL_MAX) - 1) / (SL_MAX - 1));
    knob.textContent = w; sl.setAttribute('aria-valuenow', w);
    if (document.activeElement !== $('wbox')) $('wbox').value = w;
    if (changed) { if (hoverOff()) showHover(); fit(); }
  }
  const hoverOff = () => { if (st.hover && st.hover.c >= st.w) { st.hover = null; return true; } return false; };
  const fromX = x => {
    const r = sl.querySelector('.track').getBoundingClientRect();
    return 1 + Math.round(clamp((x - r.left) / r.width, 0, 1) * (SL_MAX - 1));
  };
  sl.addEventListener('pointerdown', e => {
    sl.setPointerCapture(e.pointerId); sl.classList.add('active'); sl.focus({ preventScroll: true });
    setWidth(fromX(e.clientX));
  });
  sl.addEventListener('pointermove', e => { if (sl.hasPointerCapture(e.pointerId)) setWidth(fromX(e.clientX)); });
  ['pointerup', 'pointercancel'].forEach(ev => sl.addEventListener(ev, () => sl.classList.remove('active')));
  sl.addEventListener('keydown', e => {
    const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 5, PageDown: -5 }[e.key];
    if (d) { e.preventDefault(); setWidth(st.w + d); }
    else if (e.key === 'Home') { e.preventDefault(); setWidth(1); }
    else if (e.key === 'End') { e.preventDefault(); setWidth(SL_MAX); }
  });
  holdRepeat($('wminus'), () => setWidth(st.w - 1));
  holdRepeat($('wplus'), () => setWidth(st.w + 1));
  $('wbox').addEventListener('input', e => { if (e.target.value !== '') setWidth(+e.target.value); });
  $('wbox').addEventListener('blur', e => { e.target.value = st.w; });
  document.querySelectorAll('[data-w]').forEach(btn => btn.addEventListener('click', () => {
    const k = btn.dataset.w, { a, b } = st;
    setWidth(k === 'a' ? a : k === 'b' ? b : k === 'lcm' ? a / gcd(a, b) * b : +k);
  }));
  $('fit').addEventListener('click', fit);

  const toggle = (id, key) => {
    const f = () => { st[key] = $(id).checked; describe(); req(); };
    $(id).addEventListener('change', f); st[key] = $(id).checked;
  };
  toggle('o-num', 'nums'); toggle('o-ring', 'ring'); toggle('o-focus', 'focus'); toggle('o-lcm', 'markLcm');

  // ---- mouse / touch on the canvas ----------------------------------------------
  // one finger drags, two fingers pinch-zoom (and drag); a quick tap picks a square
  const ptrs = new Map();
  let pinch = null, tap = null;

  const local = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const cellAt = p => {
    const c = Math.floor(st.px + p.x / st.cw), r = Math.floor(st.py + (H - p.y) / st.ch);
    return c >= 0 && c < st.w && r >= 0 ? { c, r } : null;
  };
  const same = (h, g) => h && g ? h.c === g.c && h.r === g.r : h === g;
  function setHover(h) { if (!same(h, st.hover)) { st.hover = h; showHover(); req(); } }
  function startPinch() {
    const [p, q] = [...ptrs.values()];
    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    pinch = { d: Math.hypot(p.x - q.x, p.y - q.y) || 1, cw: st.cw, ch: st.ch,
              gx: st.px + mx / st.cw, gy: st.py + (H - my) / st.ch };
  }

  cv.addEventListener('pointerdown', e => {
    dropHint();
    cv.setPointerCapture(e.pointerId);
    const p = local(e);
    ptrs.set(e.pointerId, p);
    cv.classList.add('dragging');
    tap = ptrs.size === 1 ? { id: e.pointerId, x: p.x, y: p.y } : null;
    if (ptrs.size === 2) startPinch();
  });
  cv.addEventListener('pointermove', e => {
    const p = local(e);
    if (!ptrs.has(e.pointerId)) { if (e.pointerType === 'mouse') setHover(cellAt(p)); return; }
    const prev = ptrs.get(e.pointerId);
    ptrs.set(e.pointerId, p);
    if (tap && Math.hypot(p.x - tap.x, p.y - tap.y) > 8) tap = null;
    if (ptrs.size === 1) {
      st.px -= (p.x - prev.x) / st.cw;
      st.py += (p.y - prev.y) / st.ch;
      clampPan();
      if (e.pointerType === 'mouse') setHover(cellAt(p));
      req();
    } else if (ptrs.size === 2 && pinch) {
      // scale by how far apart the fingers are now, and keep the grid point that
      // started between them under their current midpoint (so pinching also drags)
      const [u, v] = [...ptrs.values()];
      const s = Math.hypot(u.x - v.x, u.y - v.y) / pinch.d;
      const mx = (u.x + v.x) / 2, my = (u.y + v.y) / 2;
      st.cw = clamp(pinch.cw * s, MIN_CELL, MAX_CELL);
      st.ch = clamp(pinch.ch * s, MIN_CELL, MAX_CELL);
      st.px = pinch.gx - mx / st.cw;
      st.py = pinch.gy - (H - my) / st.ch;
      st.fitted = false;
      clampPan(); req();
    }
  });
  const up = e => {
    if (tap && tap.id === e.pointerId && e.pointerType !== 'mouse') {
      const h = cellAt(local(e));
      setHover(same(h, st.hover) ? null : h);     // tap the same square again to clear it
    }
    tap = null;
    ptrs.delete(e.pointerId);
    if (ptrs.size === 2) startPinch(); else pinch = null;
    if (!ptrs.size) cv.classList.remove('dragging');
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !ptrs.size) setHover(null); });
  // keep Safari's own page pinch-zoom from fighting the grid's
  ['gesturestart', 'gesturechange'].forEach(ev => cv.addEventListener(ev, e => e.preventDefault()));

  // ctrl+wheel (and trackpad pinch, which arrives as ctrl+wheel) zooms; plain wheel scrolls the grid
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    dropHint();
    const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? H : 1;
    const p = local(e);
    if (e.ctrlKey || e.metaKey) {
      zoomAt(Math.exp(-clamp(e.deltaY * k, -60, 60) * .008), p.x, p.y);
    } else {
      let dx = e.deltaX * k, dy = e.deltaY * k;
      if (e.shiftKey && !dx) { dx = dy; dy = 0; }
      st.px += dx / st.cw;
      st.py -= dy / st.ch;
      clampPan(); req();
    }
    if (e.pointerType !== 'touch') setHover(cellAt(p));
  }, { passive: false });

  // ---- sizing ---------------------------------------------------------------------
  function resize() {
    const r = cv.getBoundingClientRect();
    const oldW = W;
    W = r.width; H = r.height; dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    readColors();
    if (st.fitted && W !== oldW) fit(); else { clampPan(); req(); }
  }
  new ResizeObserver(resize).observe($('stage'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); req(); });

  applyCustom();
  setWidth(st.w);
  describe();
})();
</script>
</body>
</html>
