<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiples grid</title>
<style>
  :root {
    --bg: #fbfaf7;
    --panel: rgba(255,255,255,.82);
    --panel-brd: #e3ded4;
    --ink: #24211d;
    --ink-dim: #6d675e;
    --a: #dc2626;
    --b: #2563eb;
    --ab: #7c3aed;
    --lcm: #f59e0b;
    --cell: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101319;
      --panel: rgba(24,28,36,.82);
      --panel-brd: #2b313d;
      --ink: #e7eaf0;
      --ink-dim: #99a1b0;
      --a: #ef4444;
      --b: #3b82f6;
      --ab: #8b5cf6;
      --lcm: #fbbf24;
      --cell: #181c24;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 980px; margin: 0 auto; padding: 20px 16px 32px;
    display: flex; flex-direction: column; gap: 14px;
  }
  h1 { margin: 0; font-size: 15px; font-weight: 650; }
  h1 span { color: var(--ink-dim); font-weight: 450; }
  .back { color: var(--ink-dim); font-size: 12.5px; text-decoration: none; }
  .back:hover { color: var(--ink); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-brd); border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 12px 14px;
  }

  /* ---- the two number pickers ---- */
  .pickers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .picker {
    display: flex; flex-direction: column; gap: 8px;
    border-radius: 12px; padding: 10px 12px;
    background: color-mix(in srgb, var(--c) 9%, transparent);
    border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
    touch-action: pan-y;
  }
  .picker.a { --c: var(--a); }
  .picker.b { --c: var(--b); }
  .picker .lab { font-size: 12px; color: var(--ink-dim); display: flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .stepper button {
    font: inherit; font-size: 18px; line-height: 1; color: var(--ink);
    width: 36px; height: 36px; border-radius: 999px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--panel-brd);
    user-select: none; flex: none;
  }
  .stepper button:hover { border-color: var(--c); }
  .stepper input {
    font: inherit; font-size: 28px; font-weight: 700; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; text-align: center; color: var(--c);
    width: 100%; min-width: 0; padding: 0;
    background: transparent; border: 0; border-bottom: 2px solid transparent;
    -moz-appearance: textfield; appearance: textfield;
  }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper input:focus { outline: none; border-bottom-color: var(--c); }
  .picker input[type=range] { width: 100%; margin: 0; accent-color: var(--c); }

  /* ---- options ---- */
  .more { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; margin: -4px 0; }
  .more summary {
    list-style: none; cursor: pointer; user-select: none;
    font-size: 12.5px; color: var(--ink-dim);
    padding: 4px 12px; border-radius: 999px;
    border: 1px solid var(--panel-brd); background: var(--panel);
  }
  .more summary::-webkit-details-marker { display: none; }
  .more summary:hover, .more[open] summary { color: var(--ink); }
  .more[open] summary { box-shadow: var(--shadow); }
  .more > .panel { align-self: stretch; }
  .opts { display: flex; flex-direction: column; gap: 9px; }
  .opt { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
  .opt > .k { color: var(--ink-dim); font-size: 12px; width: 70px; flex: none; }
  .seg { display: flex; flex-wrap: wrap; gap: 2px; background: color-mix(in srgb, var(--ink) 7%, transparent); border-radius: 12px; padding: 2px; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label, .mini {
    font: inherit; font-size: 12.5px; color: var(--ink);
    padding: 4px 10px; border-radius: 10px; cursor: pointer; user-select: none; white-space: nowrap;
    background: transparent; border: 0;
  }
  .seg label:hover, .mini:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
  .seg input:checked + label { background: var(--panel); box-shadow: var(--shadow); font-weight: 600; }
  .seg input:focus-visible + label { outline: 2px solid var(--b); }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; user-select: none; }
  .chk input { margin: 0; accent-color: var(--ab); }
  .opt input[type=range] { width: 120px; margin: 0; accent-color: var(--ink-dim); }
  .numbox {
    font: inherit; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--ink);
    width: 58px; padding: 2px 6px; text-align: right;
    background: color-mix(in srgb, var(--ink) 5%, transparent);
    border: 1px solid transparent; border-radius: 7px;
    -moz-appearance: textfield; appearance: textfield;
  }
  .numbox:focus { outline: none; border-color: var(--ink-dim); }
  .axis { font-size: 12px; color: var(--ink-dim); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

  /* ---- the canvas ---- */
  .stage {
    position: relative; height: clamp(320px, 64vh, 900px);
    border: 1px solid var(--panel-brd); border-radius: 14px; overflow: hidden;
    background: var(--bg);
  }
  #c { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #c.dragging { cursor: grabbing; }
  .readout {
    position: absolute; left: 10px; top: 10px; pointer-events: none;
    background: var(--panel); border: 1px solid var(--panel-brd); border-radius: 9px;
    padding: 3px 9px; font-size: 12.5px; font-variant-numeric: tabular-nums;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .readout:empty { display: none; }
  .hint { color: var(--ink-dim); font-size: 12px; text-align: center; margin-top: -6px; }
  .tip { color: var(--ink-dim); font-size: 12px; margin: -3px 0 0 80px; }
  @media (max-width: 520px) { .tip { margin-left: 0; } }
  .hint kbd, .tip kbd {
    font: inherit; font-size: 11px; border: 1px solid var(--panel-brd);
    border-bottom-width: 2px; border-radius: 5px; padding: 0 4px; background: var(--panel);
  }

  /* ---- legend ---- */
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
  .legend .item { display: flex; align-items: center; gap: 7px; }
  .legend b { font-variant-numeric: tabular-nums; }
  .chip { width: 16px; height: 16px; border-radius: 4px; background-color: var(--cell); }
  .chip.lcm { box-shadow: 0 0 0 2.5px var(--lcm); }
  .legend {
    --sa: repeating-linear-gradient(45deg, var(--a) 0 3px, transparent 3px 6px);
    --sb: repeating-linear-gradient(-45deg, var(--b) 0 3px, transparent 3px 6px);
  }
  .legend[data-scheme=hatch]  .a  { background-image: var(--sa); }
  .legend[data-scheme=hatch]  .b  { background-image: var(--sb); }
  .legend[data-scheme=hatch]  .ab { background-image: var(--sa), var(--sb); }
  .legend[data-scheme=purple] .a  { background-image: var(--sa); }
  .legend[data-scheme=purple] .b  { background-image: var(--sb); }
  .legend[data-scheme=purple] .ab { background-color: var(--ab); }
  .legend[data-scheme=alt] .a  { background-image: repeating-linear-gradient(-45deg, var(--a) 0 3px, transparent 3px 6px); }
  .legend[data-scheme=alt] .b  { background-image: repeating-linear-gradient(-45deg, var(--b) 0 3px, transparent 3px 6px); }
  .legend[data-scheme=alt] .ab { background-image: repeating-linear-gradient(-45deg, var(--a) 0 3px, var(--b) 3px 6px); }
  .legend[data-scheme=solid] .a  { background-color: var(--a); }
  .legend[data-scheme=solid] .b  { background-color: var(--b); }
  .legend[data-scheme=solid] .ab { background-color: var(--ab); }
  .legend[data-scheme=split] .a  { background-color: var(--a); }
  .legend[data-scheme=split] .b  { background-color: var(--b); }
  .legend[data-scheme=split] .ab { background-image: linear-gradient(135deg, var(--a) 50%, var(--b) 50%); }
  .note { margin-top: 8px; color: var(--ink-dim); font-size: 12.5px; }
  .note b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .note .l { color: var(--ink); background: color-mix(in srgb, var(--lcm) 30%, transparent); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<main>
  <div>
    <a class="back" href="./">← home</a>
    <h1>Multiples <span>· pick two numbers, see where they meet</span></h1>
  </div>

  <div class="pickers">
    <div class="picker a" id="pa">
      <span class="lab"><span class="swatch"></span>a</span>
      <div class="stepper">
        <button data-d="-1" aria-label="decrease a">−</button>
        <input type="number" min="1" max="999" value="3" inputmode="numeric" aria-label="a">
        <button data-d="1" aria-label="increase a">+</button>
      </div>
      <input type="range" min="1" max="50" value="3" aria-label="a slider">
    </div>
    <div class="picker b" id="pb">
      <span class="lab"><span class="swatch"></span>b</span>
      <div class="stepper">
        <button data-d="-1" aria-label="decrease b">−</button>
        <input type="number" min="1" max="999" value="4" inputmode="numeric" aria-label="b">
        <button data-d="1" aria-label="increase b">+</button>
      </div>
      <input type="range" min="1" max="50" value="4" aria-label="b slider">
    </div>
  </div>

  <details class="more">
  <summary>⚙ Options</summary>
  <div class="panel opts">
    <div class="opt">
      <span class="k">colors</span>
      <div class="seg">
        <input type="radio" name="scheme" id="s-hatch" value="hatch" checked><label for="s-hatch">Crosshatch</label>
        <input type="radio" name="scheme" id="s-purple" value="purple"><label for="s-purple">Stripes + purple</label>
        <input type="radio" name="scheme" id="s-alt" value="alt"><label for="s-alt">Red/blue stripes</label>
        <input type="radio" name="scheme" id="s-solid" value="solid"><label for="s-solid">Solid</label>
        <input type="radio" name="scheme" id="s-split" value="split"><label for="s-split">Split</label>
      </div>
    </div>
    <div class="opt">
      <span class="k">start at</span>
      <div class="seg">
        <input type="radio" name="start" id="st1" value="1" checked><label for="st1">1</label>
        <input type="radio" name="start" id="st0" value="0"><label for="st0">0</label>
      </div>
    </div>
    <div class="opt">
      <span class="k">row length</span>
      <input type="range" id="width" min="1" max="120" value="10" aria-label="row length slider">
      <input type="number" class="numbox" id="wbox" min="1" value="10" aria-label="row length">
      <div class="seg">
        <button class="mini" data-w="10">10</button>
        <button class="mini" data-w="a">= a</button>
        <button class="mini" data-w="b">= b</button>
        <button class="mini" data-w="lcm">= lcm</button>
      </div>
    </div>
    <div class="opt">
      <span class="k">zoom</span>
      <span class="axis">x <input type="range" id="zx" min="10" max="70" step="0.5" aria-label="zoom x"></span>
      <span class="axis">y <input type="range" id="zy" min="10" max="70" step="0.5" aria-label="zoom y"></span>
      <label class="chk"><input type="checkbox" id="zlink" checked> link</label>
      <div class="seg"><button class="mini" id="fit">Fit first 100</button></div>
    </div>
    <div class="tip">
      <kbd>shift</kbd>+scroll stretches x only, <kbd>alt</kbd>+scroll y only.
      On touch, pinch sideways or up-and-down.
    </div>
    <div class="opt">
      <span class="k">show</span>
      <label class="chk"><input type="checkbox" id="o-num" checked> numbers</label>
      <label class="chk"><input type="checkbox" id="o-ring" checked> ring overlaps</label>
      <label class="chk"><input type="checkbox" id="o-focus"> only overlaps</label>
      <label class="chk"><input type="checkbox" id="o-lcm" checked> mark lcm</label>
    </div>
  </div>
  </details>

  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="readout" id="readout"></div>
  </div>
  <div class="hint">drag to move · scroll or pinch to zoom</div>

  <div class="panel">
    <div class="legend" id="legend" data-scheme="hatch">
      <span class="item"><span class="chip a"></span>multiples of <b id="la">3</b></span>
      <span class="item"><span class="chip b"></span>multiples of <b id="lb">4</b></span>
      <span class="item"><span class="chip ab"></span>both</span>
      <span class="item" id="llcm"><span class="chip ab lcm"></span>lcm = <b id="ll">12</b></span>
    </div>
    <div class="note" id="note"></div>
  </div>
</main>

<script>
(() => {
  'use strict';

  const gcd = (x, y) => { while (y) [x, y] = [y, x % y]; return x; };
  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
  const $ = id => document.getElementById(id);

  const MIN_CELL = 2, MAX_CELL = 160;     // cell size limits in CSS px
  const MARGIN = 14;                      // breathing room around the grid edge
  const st = {
    a: 3, b: 4, start: 1, w: 10,
    scheme: 'hatch', nums: true, ring: true, focus: false, markLcm: true,
    cw: 40, ch: 40,       // cell width / height in CSS px
    px: 0, py: 0,         // the (column, row) shown at the bottom-left corner of the view
    hover: null
  };

  const cv = $('c'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  let col = {};          // colors read from CSS
  let pats = {};         // stripe patterns

  // ---- colors and stripe patterns --------------------------------------------
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    for (const k of ['bg', 'panel-brd', 'ink', 'ink-dim', 'a', 'b', 'ab', 'lcm', 'cell'])
      col[k] = cs.getPropertyValue('--' + k).trim();
    buildPatterns();
  }
  function tile(draw) {
    const T = 9, S = Math.round(T * dpr);
    const t = document.createElement('canvas');
    t.width = t.height = S;
    const g = t.getContext('2d');
    draw(g, S);
    const p = ctx.createPattern(t, 'repeat');
    p.T = T; p.S = S;
    return p;
  }
  const lines = (g, S, color, w, dir) => {
    g.strokeStyle = color; g.lineWidth = w; g.beginPath();
    for (let k = -1; k <= 1; k++) {
      if (dir > 0) { g.moveTo(k * S, S); g.lineTo(k * S + S, 0); }   // ╱
      else         { g.moveTo(k * S, 0); g.lineTo(k * S + S, S); }   // ╲
    }
    g.stroke();
  };
  function buildPatterns() {
    pats = {
      aUp:   tile((g, S) => lines(g, S, col.a, S * .32, 1)),
      bDown: tile((g, S) => lines(g, S, col.b, S * .32, -1)),
      aUp2:  tile((g, S) => lines(g, S, col.a, S * .32, 1)),
      bUp:   tile((g, S) => lines(g, S, col.b, S * .32, 1)),
      abUp:  tile((g, S) => { g.fillStyle = col.b; g.fillRect(0, 0, S, S); lines(g, S, col.a, S / (2 * Math.SQRT2), 1); })
    };
  }

  // ---- view geometry ------------------------------------------------------------
  // column c, row r (row 0 at the bottom) -> top-left corner on screen
  const sx = c => (c - st.px) * st.cw;
  const sy = r => H - (r - st.py + 1) * st.ch;

  function clampPan() {
    const minX = -MARGIN / st.cw, minY = -MARGIN / st.ch;
    const maxX = Math.max(minX, st.w - (W - MARGIN) / st.cw);
    st.px = clamp(st.px, minX, maxX);
    st.py = clamp(st.py, minY, 1e7);
  }

  function zoomAt(fx, fy, mx, my) {
    // keep the grid point under (mx, my) fixed while scaling by fx, fy
    const gx = st.px + mx / st.cw, gy = st.py + (H - my) / st.ch;
    st.cw = clamp(st.cw * fx, MIN_CELL, MAX_CELL);
    st.ch = clamp(st.ch * fy, MIN_CELL, MAX_CELL);
    st.px = gx - mx / st.cw;
    st.py = gy - (H - my) / st.ch;
    clampPan(); syncZoomSliders(); req();
  }

  function fit() {
    const rows = Math.ceil(100 / st.w);
    const s = clamp(Math.min((W - 2 * MARGIN) / st.w, (H - 2 * MARGIN) / rows, 64), MIN_CELL, MAX_CELL);
    st.cw = st.ch = s;
    st.px = -MARGIN / s; st.py = -MARGIN / s;
    clampPan(); syncZoomSliders(); req();
  }

  // zoom sliders are on a log scale: value v means a cell of 2^(v/10) px
  const toSlider = s => Math.log2(s) * 10;
  function syncZoomSliders() { $('zx').value = toSlider(st.cw); $('zy').value = toSlider(st.ch); }

  // ---- drawing ------------------------------------------------------------------
  let queued = false;
  const req = () => { if (!queued) { queued = true; requestAnimationFrame(draw); } };

  function kind(n) {
    const ma = n % st.a === 0, mb = n % st.b === 0;
    return ma && mb ? 3 : ma ? 1 : mb ? 2 : 0;
  }

  function fillCell(k, x, y, w, h, small) {
    const s = st.scheme;
    if (small || s === 'solid') {
      ctx.fillStyle = k === 1 ? col.a : k === 2 ? col.b : col.ab;
      if (small) {
        // snap tiny cells to whole device pixels so neighbours meet without hairline seams
        const snap = v => Math.round(v * dpr) / dpr;
        const x0 = snap(x), y0 = snap(y);
        ctx.fillRect(x0, y0, snap(x + w) - x0, snap(y + h) - y0); return;
      }
      ctx.fillRect(x, y, w, h); return;
    }
    if (s === 'split') {
      if (k === 3) {
        ctx.fillStyle = col.a; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x, y + h); ctx.fill();
        ctx.fillStyle = col.b; ctx.beginPath(); ctx.moveTo(x + w, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.fill();
      } else { ctx.fillStyle = k === 1 ? col.a : col.b; ctx.fillRect(x, y, w, h); }
      return;
    }
    ctx.fillStyle = col.cell; ctx.fillRect(x, y, w, h);
    const use = p => { ctx.fillStyle = p; ctx.fillRect(x, y, w, h); };
    if (s === 'hatch')  { if (k & 1) use(pats.aUp);  if (k & 2) use(pats.bDown); }
    if (s === 'purple') { if (k === 3) { ctx.fillStyle = col.ab; ctx.fillRect(x, y, w, h); } else use(k === 1 ? pats.aUp : pats.bDown); }
    if (s === 'alt')    use(k === 1 ? pats.aUp2 : k === 2 ? pats.bUp : pats.abUp);
  }

  function draw() {
    queued = false;
    const { a, b, start, w, cw, ch } = st;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = col.bg; ctx.fillRect(0, 0, W, H);

    // anchor the stripe patterns to the grid so they slide with it while panning
    const ox = -st.px * cw, oy = H + st.py * ch;
    for (const p of Object.values(pats)) p.setTransform(new DOMMatrix().translate(ox, oy).scale(1 / dpr));

    const c0 = Math.max(0, Math.floor(st.px)), c1 = Math.min(w - 1, Math.floor(st.px + W / cw));
    const r0 = Math.max(0, Math.floor(st.py)), r1 = Math.floor(st.py + H / ch);
    const small = Math.min(cw, ch) < 10;
    const gap = small ? 0 : Math.min(4, Math.min(cw, ch) * .1);
    const rad = small ? 0 : Math.min(6, Math.min(cw, ch) * .18);
    const iw = cw - gap, ih = ch - gap;

    // the grid's own background (covers blank cells when they're too small to outline)
    if (small) {
      ctx.fillStyle = col.cell;
      const top = Math.max(0, sy(r1)), x0 = sx(c0), x1 = sx(c1 + 1);
      ctx.fillRect(x0, top, x1 - x0, sy(r0) + ch - top);
    }

    const g = gcd(a, b), l = a / g * b;
    const fs = Math.min(ch * .42, (cw - 4) / 3.4, 16);  // sized so 3-digit numbers fit; grows no further
    let lcmCell = null;

    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        const n = start + r * w + c;
        const k = kind(n);
        const x = sx(c) + gap / 2, y = sy(r) + gap / 2;
        if (n === l) lcmCell = { x, y };
        if (k === 0 && small) continue;
        ctx.globalAlpha = st.focus && k !== 3 ? .25 : 1;

        ctx.save();
        if (!small) { ctx.beginPath(); ctx.roundRect(x, y, iw, ih, rad); ctx.clip(); }
        if (k === 0) { ctx.fillStyle = col.cell; ctx.fillRect(x, y, iw, ih); }
        else fillCell(k, x, y, iw, ih, small);
        ctx.restore();

        if (!small) {
          ctx.lineWidth = 1;
          if (k === 0) { ctx.strokeStyle = col['panel-brd']; ctx.beginPath(); ctx.roundRect(x + .5, y + .5, iw - 1, ih - 1, rad); ctx.stroke(); }
          if (k === 3 && st.ring) { ctx.strokeStyle = col.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x + 1, y + 1, iw - 2, ih - 2, Math.max(0, rad - 1)); ctx.stroke(); }
        }

        if (st.nums && fs >= 7.5) {
          const t = String(n);
          const f = Math.min(fs, (cw - 4) / (t.length * .62));
          if (f >= 6.5) {
            ctx.font = `600 ${f}px ui-sans-serif, system-ui, sans-serif`;
            const cx = x + iw / 2, cy = y + ih / 2;
            if (k !== 0 && !(st.scheme === 'solid' || small)) {
              const tw = ctx.measureText(t).width;
              ctx.fillStyle = col.cell; ctx.globalAlpha *= .88;
              ctx.beginPath(); ctx.roundRect(cx - tw / 2 - 3, cy - f * .62, tw + 6, f * 1.24, 4); ctx.fill();
              ctx.globalAlpha = st.focus && k !== 3 ? .25 : 1;
            }
            ctx.fillStyle = k === 0 ? col['ink-dim'] : (st.scheme === 'solid' || st.scheme === 'split') && !small ? '#fff' : col.ink;
            if (k !== 0 && small) ctx.fillStyle = '#fff';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(t, cx, cy + f * .04);
          }
        }
      }
    }
    ctx.globalAlpha = 1;

    // the lcm: a gold ring, plus a label when there's room
    if (st.markLcm && lcmCell && a !== b) {
      const { x, y } = lcmCell;
      ctx.strokeStyle = col.lcm;
      if (small) {
        const R = Math.max(7, Math.min(cw, ch));
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(x + cw / 2, y + ch / 2, R, 0, Math.PI * 2); ctx.stroke();
      } else {
        const lw = Math.max(3, Math.min(cw, ch) * .09);
        ctx.lineWidth = lw;
        ctx.beginPath(); ctx.roundRect(x - lw / 2 - 1, y - lw / 2 - 1, iw + lw + 2, ih + lw + 2, rad + lw / 2); ctx.stroke();
        if (Math.min(cw, ch) >= 22) {
          ctx.font = `700 11px ui-sans-serif, system-ui, sans-serif`;
          const tw = ctx.measureText('lcm').width + 10;
          const tx = x + iw / 2 - tw / 2, ty = y - lw - 13;
          ctx.fillStyle = col.lcm;
          ctx.beginPath(); ctx.roundRect(tx, ty, tw, 15, 7); ctx.fill();
          ctx.fillStyle = '#1c1917'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('lcm', x + iw / 2, ty + 8);
        }
      }
    }

    // hover outline
    if (st.hover) {
      const { c, r } = st.hover;
      ctx.strokeStyle = col.ink; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
      ctx.strokeRect(sx(c) + .75, sy(r) + .75, cw - 1.5, ch - 1.5);
      ctx.setLineDash([]);
    }
  }

  // ---- text below and above the canvas ------------------------------------------
  function describe() {
    const { a, b, start } = st, g = gcd(a, b), l = a / g * b;
    $('la').textContent = a; $('lb').textContent = b; $('ll').textContent = l;
    $('llcm').style.display = st.markLcm && a !== b ? '' : 'none';
    $('note').innerHTML = a === b
      ? `Same number twice — every multiple overlaps.`
      : `The overlaps are exactly the multiples of <span class="l">${l}</span>, the <b>least common multiple</b>: ` +
        `the smallest number both ${a} and ${b} divide ` +
        (g === 1
          ? `(they share no common factor, so it's just ${a} × ${b}).`
          : `(${a} × ${b} ÷ ${g}, because they share the factor <b>${g}</b>).`) +
        ` So 1 in ${a} cells is red, 1 in ${b} is blue, and 1 in ${l} is both.` +
        (start === 0 ? ` 0 counts as both: it's 0 × anything.` : '');
    showHover();
  }
  function showHover() {
    const h = st.hover;
    if (!h) { $('readout').textContent = ''; return; }
    const n = st.start + h.r * st.w + h.c, k = kind(n);
    const what = ['', `multiple of ${st.a}`, `multiple of ${st.b}`, `multiple of both`][k];
    $('readout').textContent = `${n}` + (what ? ` · ${what}` : '') + ` · row ${h.r}, column ${h.c}`;
  }

  // ---- controls -----------------------------------------------------------------
  function picker(id, key) {
    const root = $(id);
    const num = root.querySelector('input[type=number]');
    const rng = root.querySelector('input[type=range]');
    const set = v => {
      v = clamp(Math.round(v) || 1, 1, 999);
      st[key] = v; num.value = v; rng.value = Math.min(v, +rng.max);
      describe(); req();
    };
    num.addEventListener('input', () => { if (num.value !== '') set(+num.value); });
    num.addEventListener('blur', () => set(+num.value));
    rng.addEventListener('input', () => set(+rng.value));
    root.querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => set(st[key] + +b.dataset.d)));
    // scroll the wheel anywhere over the picker to change the number
    let acc = 0;
    root.addEventListener('wheel', e => {
      e.preventDefault();
      acc += e.deltaY;
      if (Math.abs(acc) >= 40) { set(st[key] + (acc < 0 ? 1 : -1)); acc = 0; }
    }, { passive: false });
  }
  picker('pa', 'a');
  picker('pb', 'b');

  document.querySelectorAll('input[name=scheme]').forEach(r => r.addEventListener('change', () => {
    st.scheme = $('legend').dataset.scheme = r.value; req();
  }));
  document.querySelectorAll('input[name=start]').forEach(r => r.addEventListener('change', () => {
    st.start = +r.value; describe(); req();
  }));

  function setWidth(w, refit) {
    st.w = clamp(Math.round(w) || 1, 1, 100000);
    $('width').value = Math.min(st.w, 120); $('wbox').value = st.w;
    if (refit) fit(); else { clampPan(); req(); }
  }
  $('width').addEventListener('input', e => setWidth(+e.target.value));
  $('wbox').addEventListener('change', e => setWidth(+e.target.value, true));
  document.querySelectorAll('[data-w]').forEach(btn => btn.addEventListener('click', () => {
    const k = btn.dataset.w, { a, b } = st;
    setWidth(k === 'a' ? a : k === 'b' ? b : k === 'lcm' ? a / gcd(a, b) * b : +k, true);
  }));

  // zoom sliders zoom around the bottom-left corner; "link" moves both together
  ['zx', 'zy'].forEach(id => $(id).addEventListener('input', e => {
    const s = 2 ** (+e.target.value / 10);
    const f = s / (id === 'zx' ? st.cw : st.ch);
    const fx = id === 'zx' || $('zlink').checked ? f : 1;
    const fy = id === 'zy' || $('zlink').checked ? f : 1;
    zoomAt(fx, fy, 0, H);
  }));
  $('fit').addEventListener('click', fit);

  const toggle = (id, key) => {
    const f = () => { st[key] = $(id).checked; describe(); req(); };
    $(id).addEventListener('change', f); st[key] = $(id).checked;
  };
  toggle('o-num', 'nums'); toggle('o-ring', 'ring'); toggle('o-focus', 'focus'); toggle('o-lcm', 'markLcm');

  // ---- mouse / touch on the canvas ----------------------------------------------
  const ptrs = new Map();
  let pinch = null;

  const local = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  function hoverAt(p) {
    const c = Math.floor(st.px + p.x / st.cw), r = Math.floor(st.py + (H - p.y) / st.ch);
    const h = c >= 0 && c < st.w && r >= 0 ? { c, r } : null;
    if (JSON.stringify(h) !== JSON.stringify(st.hover)) { st.hover = h; showHover(); req(); }
  }

  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, local(e));
    cv.classList.add('dragging');
    if (ptrs.size === 2) {
      const [p, q] = [...ptrs.values()];
      pinch = { dx: Math.abs(p.x - q.x), dy: Math.abs(p.y - q.y), cw: st.cw, ch: st.ch,
                mx: (p.x + q.x) / 2, my: (p.y + q.y) / 2 };
    }
  });
  cv.addEventListener('pointermove', e => {
    const p = local(e);
    if (!ptrs.has(e.pointerId)) { hoverAt(p); return; }
    const prev = ptrs.get(e.pointerId);
    ptrs.set(e.pointerId, p);
    if (ptrs.size === 1) {
      st.px -= (p.x - prev.x) / st.cw;
      st.py += (p.y - prev.y) / st.ch;
      clampPan(); hoverAt(p); req();
    } else if (ptrs.size === 2 && pinch) {
      // fingers spread sideways stretch x, spread up-and-down stretch y
      const [u, v] = [...ptrs.values()];
      const dx = Math.abs(u.x - v.x), dy = Math.abs(u.y - v.y);
      const fx = pinch.dx > 40 ? (pinch.cw * dx / pinch.dx) / st.cw : 1;
      const fy = pinch.dy > 40 ? (pinch.ch * dy / pinch.dy) / st.ch : 1;
      zoomAt(fx, fy, pinch.mx, pinch.my);
    }
  });
  const up = e => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (!ptrs.size) cv.classList.remove('dragging');
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', () => { if (!ptrs.size && st.hover) { st.hover = null; showHover(); req(); } });

  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const d = e.deltaY || e.deltaX;
    const f = Math.exp(-d * (e.deltaMode === 1 ? 0.05 : 0.0018));
    const p = local(e);
    zoomAt(e.altKey ? 1 : f, e.shiftKey ? 1 : f, p.x, p.y);
  }, { passive: false });

  // ---- sizing ---------------------------------------------------------------------
  let first = true;
  function resize() {
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height; dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    readColors();
    if (first) { first = false; fit(); } else { clampPan(); req(); }
  }
  new ResizeObserver(resize).observe($('stage'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); req(); });

  describe();
})();
</script>
</body>
</html>
