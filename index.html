<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Doodles</title>
<style>
  :root {
    --bg: #fbfaf7;
    --panel: #ffffff;
    --panel-brd: #e3ded4;
    --ink: #24211d;
    --ink-dim: #6d675e;
    --accent: #2563eb;
    --warm: #c2410c;
    --a: #dc2626;
    --b: #2563eb;
    --ab: #7c3aed;
    --lcm: #f59e0b;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101319;
      --panel: #181c24;
      --panel-brd: #2b313d;
      --ink: #e7eaf0;
      --ink-dim: #99a1b0;
      --accent: #60a5fa;
      --warm: #fb923c;
      --a: #ef4444;
      --b: #3b82f6;
      --ab: #8b5cf6;
      --lcm: #fbbf24;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .sub { margin: 0 0 24px; color: var(--ink-dim); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--panel); border: 1px solid var(--panel-brd); border-radius: 14px;
    padding: 14px; color: inherit; text-decoration: none;
    transition: box-shadow .15s, transform .15s;
  }
  .card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .card svg { width: 100%; height: auto; display: block; border-radius: 8px; background: var(--bg); }
  .card h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .card p { margin: 0; color: var(--ink-dim); font-size: 13.5px; }
</style>
</head>
<body>
<main>
  <h1>Math Doodles</h1>
  <p class="sub">Small pictures you can poke at.</p>

  <div class="cards">
    <a class="card" href="shearing.html">
      <svg viewBox="0 0 200 110" aria-hidden="true">
        <line x1="20" y1="25" x2="180" y2="25" stroke="var(--ink-dim)" stroke-dasharray="4 4"/>
        <polygon points="50,90 130,90 70,25" fill="var(--ink-dim)" opacity=".18"/>
        <polygon points="50,90 130,90 150,25" fill="var(--accent)" opacity=".25" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="150" cy="25" r="5" fill="var(--warm)"/>
      </svg>
      <h2>Shearing</h2>
      <p>Slide a triangle's tip sideways. Its area never changes.</p>
    </a>

    <a class="card" href="multiples.html">
      <svg viewBox="0 0 200 110" aria-hidden="true" id="mini"></svg>
      <h2>Multiples</h2>
      <p>Pick two numbers and see where their multiples meet.</p>
    </a>

    <a class="card" href="gcf.html">
      <svg viewBox="0 0 200 110" aria-hidden="true">
        <!-- a 5 × 3 rectangle tiled with 2 × 2 squares: the third column and second row poke out -->
        <rect x="40" y="35" width="100" height="60" fill="var(--panel)"/>
        <path d="M40 55h40v40h-40zM120 55h40v40h-40zM80 15h40v40h-40z" fill="var(--ab)" opacity=".15"/>
        <rect x="140" y="15" width="20" height="80" fill="var(--a)" opacity=".2"/>
        <rect x="40" y="15" width="100" height="20" fill="var(--a)" opacity=".2"/>
        <path d="M40 15v80M80 15v80M120 15v80M160 15v80M40 15h120M40 55h120M40 95h120" stroke="var(--ab)" stroke-opacity=".6" fill="none"/>
        <rect x="40" y="35" width="100" height="60" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
      </svg>
      <h2>Greatest common factor</h2>
      <p>Tile a rectangle with squares. Which squares fit with nothing sticking out?</p>
    </a>
  </div>
</main>
<script>
  // a tiny preview of the multiples grid: 3s red, 4s blue, both purple, 12 ringed gold
  (() => {
    const svg = document.getElementById('mini'), ns = 'http://www.w3.org/2000/svg';
    const cols = 10, rows = 5, s = 18, ox = (200 - cols * s) / 2, oy = (110 - rows * s) / 2;
    for (let i = 0; i < cols * rows; i++) {
      const n = i + 1, c = i % cols, r = Math.floor(i / cols);
      const k = (n % 3 === 0) + 2 * (n % 4 === 0);
      const rect = document.createElementNS(ns, 'rect');
      rect.setAttribute('x', ox + c * s + 1.5); rect.setAttribute('y', oy + (rows - 1 - r) * s + 1.5);
      rect.setAttribute('width', s - 3); rect.setAttribute('height', s - 3); rect.setAttribute('rx', 3);
      rect.setAttribute('fill', ['var(--panel)', 'var(--a)', 'var(--b)', 'var(--ab)'][k]);
      if (!k) { rect.setAttribute('stroke', 'var(--panel-brd)'); }
      if (n === 12) { rect.setAttribute('stroke', 'var(--lcm)'); rect.setAttribute('stroke-width', 2.5); }
      svg.appendChild(rect);
    }
  })();
</script>
</body>
</html>
